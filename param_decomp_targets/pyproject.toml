[project]
name = "param-decomp-targets"
version = "0.0.1"
description = "The vendored decomposition targets: every DecomposedModel impl, one slice per architecture"
requires-python = "==3.13.*"
urls = { "Homepage" = "https://github.com/goodfire-ai/param-decomp" }
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    # Version pins live in the core distribution (the single source of truth for the JAX
    # stack); this package only names its direct imports and lets the workspace resolve.
    "param-decomp==0.0.1",
    "equinox",
    "jax",
    "jaxtyping",
    "numpy",
    "optax",
    "pyyaml",
    "safetensors",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false
packages = [
    "param_decomp_targets",
    "param_decomp_targets.tests",
    "param_decomp_targets.tests.equivalence",
    "param_decomp_targets.tests.qwen3_hf_parity",
    "param_decomp_targets.tests.simple_mlp_equivalence",
    "param_decomp_targets.tests.stacked_parity",
]

[tool.setuptools.package-dir]
param_decomp_targets = "."
