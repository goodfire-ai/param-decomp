name: Checks
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - "**"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}/ci-mpi:latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Container runs as different user than repo owner, causing "dubious ownership" errors.
      # Tests that run subprocesses (e.g. test_distributed.py) need git commands to work.
      - name: Configure git safe directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.19"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: make install-ci

      - name: Print dependencies
        run: uv pip list

      - name: Cache HuggingFace downloads
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: hf-${{ github.run_id }}
          restore-keys: |
            hf-

      # Compiled executables are content-addressed by HLO + backend + jax/xla version
      # (conftest.py pins the CPU ISA ceiling to AVX2 so a cache entry stays valid across
      # any runner), so a stale or cross-lockfile hit is a safe no-op miss, not a wrong
      # answer — restore-keys lets a uv.lock bump degrade to a partial hit instead of cold.
      - name: Cache JAX compilation cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.jax_test_cache
          key: jax-test-cache-${{ hashFiles('uv.lock') }}
          restore-keys: |
            jax-test-cache-

      - name: Run basedpyright
        run: uv run basedpyright

      - name: Run ruff lint
        run: uv run ruff check --fix-only .

      - name: Run ruff format
        run: uv run ruff format .

      - name: Run tests
        # `make test-all` runs the 1-device suite then the multidevice subset (sim CPU devices).
        run: make test-all
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
          HF_HOME: ${{ github.workspace }}/.hf-cache
