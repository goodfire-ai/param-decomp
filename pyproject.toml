[project]
name = "param-decomp"
version = "0.0.1"
description = "Parameter decomposition: the generic VPD library (core engine, targets, pretraining, vendored archs)"
requires-python = ">=3.12,<3.14"
urls = { "Homepage" = "https://github.com/goodfire-ai/param-decomp" }
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    # The torch-free pydantic config schema now ships inside this distribution
    # (`param_decomp.configs` / `base_config` / `schedule`), so it carries the schema's
    # leaf deps directly (was the dissolved `param-decomp-config` package).
    "pydantic<2.12", # https://github.com/goodfire-ai/param-decomp/pull/232 , issues/221
    "annotated-types",
    "jax==0.10.1",
    "equinox==0.13.8",
    "optax==0.2.8",
    "jaxtyping==0.3.10",
    "beartype==0.22.2",
    "einops==0.8.2",
    "numpy==2.4.6",
    "safetensors==0.7.0",
    "pyarrow==19.0.1",
    "pyyaml==6.0.2",
    "orbax-checkpoint==0.12.0",
    "wandb==0.21.0",
    "matplotlib==3.10.8",
    "pillow==12.0.0",
    # Explicit (not just transitive): param_decomp.components imports TypeVar from
    # typing_extensions for PEP 696 defaults on Python 3.12.
    "typing-extensions==4.15.0",
    # Composition / consumer-layer deps (absorbed from the dissolved param-decomp-lab
    # distribution when the lab merged into the library).
    "fire",
    "wandb-workspaces==0.1.12", # See https://github.com/wandb/wandb-workspaces/issues/65
    "sympy",
    "streamlit",
    "streamlit-antd-components",
    "scipy>=1.14.1",
    "zstandard", # For streaming datasets
    "kaleido==0.2.1",
    "numba>=0.64.0",
    "nvtx==0.2.15",
    "requests",
    "python-dotenv",
    "tqdm",
    "transformers",
    # `datasets` less than 2.21.0 causes issues due to incompatibility with numpy>=2.0
    "datasets>=2.21.0",
]

[project.optional-dependencies]
# Pre-r580 driver arm. Keep the exact NVIDIA pins on one coherent CUDA 12.8.1
# release train: component versions do not encode the toolkit minor.
cuda = [
    "jax[cuda12]==0.10.1",
    "nvidia-cublas-cu12==12.8.4.1",
    "nvidia-cuda-cccl-cu12==12.8.90",
    "nvidia-cuda-cupti-cu12==12.8.90",
    "nvidia-cuda-nvcc-cu12==12.8.93",
    "nvidia-cuda-nvrtc-cu12==12.8.93",
    "nvidia-cuda-runtime-cu12==12.8.90",
    "nvidia-cudnn-cu12==9.8.0.87",
    "nvidia-cufft-cu12==11.3.3.83",
    "nvidia-cusolver-cu12==11.7.3.90",
    "nvidia-cusparse-cu12==12.5.8.93",
    "nvidia-nccl-cu12==2.25.1",
    "nvidia-nvjitlink-cu12==12.8.93",
    "nvidia-nvshmem-cu12==3.2.5",
]
# r580+ driver arm. cuBLAS >= 13.2 avoids a Blackwell TMEM double-free.
cuda13 = ["jax[cuda13]==0.10.1", "nvidia-cublas>=13.2.0.9"]

# No [project.scripts]: this library ships no console commands. Every runnable surface is
# a module main (`python -m param_decomp.experiments.<family>.run`,
# `-m param_decomp.pretrain.train`, and the clustering worker modules).

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov", # for coverage reports
    "pytest-xdist", # parallel test execution
    "pytest-testmon", # only re-run tests affected by code changes
    "ruff",
    "basedpyright<1.32.0", # pyright and wandb issues, see https://github.com/goodfire-ai/param-decomp/pull/232
    "pre-commit",
    "scikit-learn",
    "ipykernel",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
param_decomp = [
    "experiments/**/*.yaml",
    "pretrain/configs/**/*.yaml",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["param_decomp", "param_decomp.*"]
namespaces = false


[tool.ruff]
line-length = 100
fix = true
extend-exclude = ["**/_scratch", "**/*_pb2.py", "**/*_pb2.pyi"]

[tool.ruff.lint]
ignore = [
    "F722", # Incompatible with jaxtyping
    "E731", # I think lambda functions are fine in several places
    "E501", # there are a lot of long lines in the codebase
]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true

[tool.ruff.lint.isort]
known-third-party = ["wandb"]

[tool.pyright]
# nano_param_decomp/ is the standalone torch single-file VPD reference impl for paper
# readers (see README); it is the one torch island left in the repo and is type-checked
# in a torch env, not this JAX-only one.
# `vendored_jax` is a verbatim numeric mirror of the torch vendored Llama — kept out of
# type-checking (its correctness contract is the parity tests, not types).
include = ["param_decomp"]
exclude = [
    "**/wandb/**",
    "**/_scratch/**",
    "**/node_modules/**",
    "**/__pycache__",
    "**/*_pb2.py",
    "**/*_pb2.pyi",
    "nano_param_decomp",
    "param_decomp/vendored_jax",
    "param_decomp/targets/tests/qwen3_hf_parity/gen_hf_fixtures.py",  # torch-env script
    "param_decomp/targets/tests/stacked_parity/gen_stacked_fixtures.py",  # base-branch-only script (pre-restructure API)
]
stubPath = "typings" # Having type stubs for transformers shaves 10 seconds off basedpyright calls

strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportFunctionMemberAccess = true
reportUnknownParameterType = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportOverlappingOverload = true
reportConstantRedefinition = true
reportImportCycles = true
reportPropertyTypeMismatch = true
reportMissingTypeArgument = true
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportUnnecessaryContains = true
reportUnusedExpression = true
reportMatchNotExhaustive = true
reportPrivateImportUsage = false
# basedpyright
reportCallIssue = true
reportAny = false
reportUnusedCallResult = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportExplicitAny = false
reportMissingTypeStubs = false
reportImplicitStringConcatenation = false
reportPrivateUsage = false
reportUnannotatedClassAttribute = false
reportUnknownLambdaType = false



[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
filterwarnings = [
    # https://github.com/google/python-fire/pull/447
    "ignore::DeprecationWarning:fire:59",
    # Ignore Pydantic V1 deprecation warnings from wandb_workspaces
    "ignore:Pydantic V1 style.*:DeprecationWarning:wandb_workspaces",
]
