# yaml-language-server: $schema=postprocess.schema.json

harvest:
  n_gpus: 32
  time: "24:00:00"
  merge_time: "24:00:00"
  config:
    method_config:
      type: SPDHarvestConfig
      wandb_path: "wandb:goodfire/spd/s-82ffb969"
    n_batches: 20000
    batch_size: 32
    activation_examples_per_component: 400
    activation_context_tokens_per_side: 20
    pmi_token_top_k: 40
    max_examples_per_batch_per_component: 5

autointerp:
  time: "24:00:00"
  config:
    model: "google/gemini-3-flash-preview"
    reasoning_effort: "low"
    # model: "google/gemini-3.1-pro-preview"
    # reasoning_effort: "low"
    template_strategy:
      type: dual_view
    cost_limit_usd: 2000
  evals:
    model: "google/gemini-3-flash-preview"
    reasoning_effort: "low"
    detection_config:
      type: detection
      n_activating: 5
      n_non_activating: 5
      n_trials: 5
    fuzzing_config:
      type: fuzzing
      n_correct: 5
      n_incorrect: 2
      n_trials: 5
    cost_limit_usd: 1000


intruder:
  config:
    model: google/gemini-3-flash-preview
    reasoning_effort: "none"
    n_real: 4
    n_trials: 10
    density_tolerance: 0.05
    max_concurrent: 50
    max_requests_per_minute: 200
    cost_limit_usd: 1000

attributions:
  n_gpus: 32
  time: "24:00:00"
  merge_time: "24:00:00"
  config:
    spd_run_wandb_path: "wandb:goodfire/spd/s-82ffb969"
    n_batches: 1280

graph_interp:
  time: "24:00:00"
  config:
    model: "google/gemini-3-flash-preview"
    reasoning_effort: "low"
    # model: "google/gemini-3.1-pro-preview"
    # reasoning_effort: "low"
    cost_limit_usd: 2000

