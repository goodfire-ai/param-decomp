# Example: Harvest e2e transcoder activations from the Jose sweep.
#
# These transcoders are from the same e2e sweep as the CLTs, trained on Jose's
# base model (t-9d2b8f02). Better for VPD comparison than the existing tc-3f297233
# which uses a different base model (t-32d1bb3b).
#
# tc_parallel_k32: BatchTopK k=32, 4096 dict, per-layer, parallel e2e training.
#
# Usage:
#   spd-harvest scripts/harvest_jose_tc_example.yaml

config:
  method_config:
    type: TranscoderHarvestConfig
    base_model_path: "wandb:goodfire/spd/t-9d2b8f02"
    artifact_paths:
      "h.0.mlp": "mats-sprint/pile_e2e_sweep_jose/tc_parallel_k32_checkpoint_layer0_final:v0"
      "h.1.mlp": "mats-sprint/pile_e2e_sweep_jose/tc_parallel_k32_checkpoint_layer1_final:v0"
      "h.2.mlp": "mats-sprint/pile_e2e_sweep_jose/tc_parallel_k32_checkpoint_layer2_final:v0"
      "h.3.mlp": "mats-sprint/pile_e2e_sweep_jose/tc_parallel_k32_checkpoint_layer3_final:v0"
  n_batches: 20
  batch_size: 8
  activation_examples_per_component: 20
  activation_context_tokens_per_side: 10
  pmi_token_top_k: 10

n_gpus: 1
