# Postprocess: CLT parallel (pile_e2e_sweep_jose, k32, base=t-9d2b8f02)
# Harvest 1000 batches, autointerp + evals, intruder scoring.

harvest:
  config:
    method_config:
      type: CLTHarvestConfig
      base_model_path: "wandb:goodfire/spd/t-9d2b8f02"
      artifact_path: "mats-sprint/pile_e2e_sweep_jose/clt_parallel_k32_checkpoint_final:v0"
    n_batches: 1000
    batch_size: 32
  n_gpus: 4

autointerp:
  config:
    model: "google/gemini-3-flash-preview"
    reasoning_effort: "low"
    max_requests_per_minute: 200
    limit: 1000
    template_strategy:
      type: dual_view
  evals:
    model: "google/gemini-3-flash-preview"
    reasoning_effort: "none"
    max_requests_per_minute: 200
    limit: 1000
    detection_config:
      type: detection
    fuzzing_config:
      type: fuzzing

intruder:
  config:
    max_requests_per_minute: 200
    limit: 1000

attributions: null
graph_interp: null
