# 32-rank 3-pool config (4 nodes) for torch.profiler scale test.
# Layout:
#   LW: 6 blocks × 4 ranks = ranks 0..23  (12 layers q+k = 24 sites, 4 sites/block)
#   CI:  ranks 24..27 (4 ranks)
#   PPGD: ranks 28..31 (4 ranks)
# n_per_block_lw=4, n_ci=4: 4%4=0 ✓
# n_ppgd=4, n_ci=4:        4%4=0 ✓
pd:
  seed: 0
  n_mask_samples: 1
  ci_config:
    mode: global
    fn_type: global_shared_transformer
    simple_transformer_ci_cfg:
      d_model: 512
      n_blocks: 2
      mlp_hidden_dim:
      - 2048
      attn_config:
        n_heads: 8
        max_len: 256
        rope_base: 10000.0
  sampling: continuous
  sigmoid_type: leaky_hard
  decomposition_targets:
  - module_pattern: h.*.attn.q_proj
    C: 64
  - module_pattern: h.*.attn.k_proj
    C: 64
  identity_decomposition_targets: null
  use_delta_component: true
  batch_size: 16
  steps: 10
  components_optimizer:
    lr_schedule:
      start_val: 5.0e-05
      warmup_pct: 0.0
      final_val_frac: 0.1
      fn_type: cosine
    grad_clip_norm: 0.01
  ci_fn_optimizer:
    lr_schedule:
      start_val: 1.0e-04
      warmup_pct: 0.0
      final_val_frac: 0.1
      fn_type: cosine
  faithfulness_warmup_steps: 0
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - type: FaithfulnessLoss
    coeff: 1.0e+08
  - type: StochasticReconLayerwiseLoss
    coeff: 50.0
  - type: ImportanceMinimalityLoss
    coeff: 4.0e-05
    pnorm: 2.0
    p_anneal_start_frac: 0.0
    p_anneal_final_p: 0.3
    p_anneal_end_frac: 1.0
    eps: 1.0e-12
  - type: FrequencyMinimalityLoss
    coeff: 2.0e-05
    pnorm: 2.0
    reference_token_count: 4096
    p_anneal_start_frac: 0.0
    p_anneal_final_p: 0.3
    p_anneal_end_frac: 1.0
    eps: 1.0e-12
  - type: PersistentPGDReconLoss
    coeff: 1.0
    optimizer:
      type: adam
      beta1: 0.5
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        start_val: 0.01
        warmup_pct: 0.025
        final_val_frac: 1.0
        fn_type: constant
    scope:
      type: per_batch_per_position
    use_sigmoid_parameterization: false
    n_warmup_steps: 2
    n_samples: 1
cadence:
  train_log_every: 1
  save_every: null
eval: null
runtime:
  autocast_bf16: true
  device: cuda
  dp: null
target:
  spec:
    kind: hf_weights_in_vendored
    model_class: param_decomp_lab.experiments.lm.pretrain.models.gpt2_simple.GPT2Simple
    model_name: openai-community/gpt2
  output_extract: 0
  activation_checkpointing: false
data:
  tokenizer_name: openai-community/gpt2
  max_seq_len: 256
  dataset_name: apollo-research/Skylion007-openwebtext-tokenizer-gpt2
  column_name: input_ids
  train_split: train
  eval_split: train
  is_tokenized: true
  streaming: true
  buffer_size: 1000
  shuffle_each_epoch: true
three_pool:
  use_fused_kl: true
  ci_ranks: [24, 25, 26, 27]
  ppgd_ranks: [28, 29, 30, 31]
  layerwise_block_groups:
  - ranks: [0, 1, 2, 3]
    owned_sites:
    - h.0.attn.q_proj
    - h.0.attn.k_proj
    - h.1.attn.q_proj
    - h.1.attn.k_proj
  - ranks: [4, 5, 6, 7]
    owned_sites:
    - h.2.attn.q_proj
    - h.2.attn.k_proj
    - h.3.attn.q_proj
    - h.3.attn.k_proj
  - ranks: [8, 9, 10, 11]
    owned_sites:
    - h.4.attn.q_proj
    - h.4.attn.k_proj
    - h.5.attn.q_proj
    - h.5.attn.k_proj
  - ranks: [12, 13, 14, 15]
    owned_sites:
    - h.6.attn.q_proj
    - h.6.attn.k_proj
    - h.7.attn.q_proj
    - h.7.attn.k_proj
  - ranks: [16, 17, 18, 19]
    owned_sites:
    - h.8.attn.q_proj
    - h.8.attn.k_proj
    - h.9.attn.q_proj
    - h.9.attn.k_proj
  - ranks: [20, 21, 22, 23]
    owned_sites:
    - h.10.attn.q_proj
    - h.10.attn.k_proj
    - h.11.attn.q_proj
    - h.11.attn.k_proj
