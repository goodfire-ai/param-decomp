# JAX leg of the torch<->JAX single-pool comparison (2026-06-12). Derived from the
# torch leg param_decomp_lab/experiments/lm/pile_llama_simple_mlp-4L_ppgd_sc.yaml
# (itself the p-20f9fc15 recipe with the single edit PPGD scope bsc -> sc; see its
# header). Target: LlamaSimpleMLP 4L pile model (t-9d2b8f02). DOCUMENTED EDITS vs
# the torch leg (the standard JAX-route data/cadence edits, per
# pile_llama_simple_mlp_4l_pgd1.yaml precedent):
#   1. data: streaming HF danbraunai/pile-uncopyrighted-tok-shuffled -> the staged
#      parquet artifact (datasets/pile_neox_tok_512, first 110 train shards =
#      ~26.7M rows > the 25.6M the run consumes; same corpus, same seq 512 — the
#      JAX trainer reads pre-tokenized parquet shards only).
#   2. data.eval_split: val -> train (parquet loading exposes a single "train"
#      split; JAX eval is an independent seeded stream over the same corpus).
#   3. cadence.save_every: null -> 5000, keep_last null -> 2 (upstream saves only
#      the final step; the JAX leg checkpoints for requeue-resume + offline eval).
# Everything else (pd losses/optimizers/CI fn, 400k steps, batch 64, eval set) is
# torch-leg-identical. Launch: pd-jax-lm, 1 node (small target, no remat).
pd:
  seed: 0
  n_mask_samples: 1
  ci_config:
    mode: global
    fn_type: global_shared_transformer
    hidden_dims: null
    simple_transformer_ci_cfg:
      d_model: 2048
      n_blocks: 8
      mlp_hidden_dim:
      - 8192
      attn_config:
        n_heads: 16
        max_len: 512
        rope_base: 10000.0
  sampling: continuous
  sigmoid_type: leaky_hard
  decomposition_targets:
  - module_pattern: h.*.mlp.c_fc
    C: 3072
  - module_pattern: h.*.mlp.down_proj
    C: 3584
  - module_pattern: h.*.attn.q_proj
    C: 512
  - module_pattern: h.*.attn.k_proj
    C: 512
  - module_pattern: h.*.attn.v_proj
    C: 1024
  - module_pattern: h.*.attn.o_proj
    C: 1024
  identity_decomposition_targets: null
  use_delta_component: true
  components_optimizer:
    lr_schedule:
      start_val: 5.0e-05
      warmup_pct: 0.0
      final_val_frac: 0.1
      fn_type: cosine
    grad_clip_norm: 0.01
  ci_fn_optimizer:
    lr_schedule:
      start_val: 5.0e-05
      warmup_pct: 0.0
      final_val_frac: 0.1
      fn_type: cosine
  steps: 400000
  batch_size: 64
  faithfulness_warmup_steps: 400
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
    - type: ImportanceMinimalityLoss
      coeff: 0.0002
      pnorm: 2.0
      beta: 0.5
      p_anneal_start_frac: 0.0
      p_anneal_final_p: 0.4
      p_anneal_end_frac: 1.0
      eps: 1.0e-12
    - type: StochasticReconSubsetLoss
      coeff: 0.5
      routing:
        type: uniform_k_subset
    - type: PersistentPGDReconLoss
      coeff: 0.5
      optimizer:
        type: adam
        beta1: 0.5
        beta2: 0.99
        eps: 1.0e-08
        lr_schedule:
          start_val: 0.01
          warmup_pct: 0.025
          final_val_frac: 1.0
          fn_type: constant
      scope:
        type: sc
      use_sigmoid_parameterization: false
      n_warmup_steps: 2
    - type: FaithfulnessLoss
      coeff: 10000000.0
cadence:
  train_log_every: 200
  save_every: 5000
  keep_last_n_checkpoints: 2
eval:
  n_steps: 1
  batch_size: 128
  every: 1000
  slow_every: 10000
  slow_on_first_step: true
  metrics:
    - type: CIHistograms
      n_batches_accum: 1
    - type: ComponentActivationDensity
    - type: CI_L0
      groups:
        layer_0:
        - h.0.*
        layer_1:
        - h.1.*
        layer_2:
        - h.2.*
        layer_3:
        - h.3.*
        total:
        - '*'
    - type: CEandKLLosses
      rounding_threshold: 0.0
    - type: CIMeanPerComponent
    - type: StochasticHiddenActsReconLoss
    - type: CIHiddenActsReconLoss
    - type: PGDReconLoss
      init: random
      step_size: 0.1
      n_steps: 20
      mask_scope: c
target:
  spec:
    kind: pretrained
    model_class: param_decomp_lab.experiments.lm.pretrain.models.llama_simple_mlp.LlamaSimpleMLP
    run_path: goodfire/spd/runs/t-9d2b8f02
  output_extract: 0
data:
  tokenizer_name: EleutherAI/gpt-neox-20b
  max_seq_len: 512
  buffer_size: 1000
  dataset_name: parquet
  data_files: /mnt/data/artifacts/mechanisms/param-decomp/datasets/pile_neox_tok_512/*.parquet
  column_name: input_ids
  train_split: train
  eval_split: train
  shuffle_each_epoch: true
  is_tokenized: true
  streaming: false
runtime:
  autocast_bf16: true
  device: cuda
  dp: null
wandb:
  project: param-decomp
