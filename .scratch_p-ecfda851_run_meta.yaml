cadence:
  keep_last_n_checkpoints: null
  save_every: 5000
  train_log_every: 100
data:
  buffer_size: 1000
  column_name: input_ids
  dataset_name: apollo-research/Skylion007-openwebtext-tokenizer-gpt2
  eval_split: train
  is_tokenized: true
  max_seq_len: 1024
  shuffle_each_epoch: true
  streaming: true
  tokenizer_name: openai-community/gpt2
  train_split: train
eval:
  batch_size: 128
  every: 1000
  metrics:
  - ci_alive_threshold: 0.0
    groups:
      k_proj:
      - h.*.attn.k_proj
      layer_0:
      - h.0.*
      layer_23:
      - h.23.*
      layer_47:
      - h.47.*
      q_proj:
      - h.*.attn.q_proj
      total:
      - '*'
    type: CI_L0
  - rounding_threshold: 0.0
    type: CEandKLLosses
  - coeff: null
    init: random
    mask_scope: shared_across_batch
    n_steps: 20
    step_size: 0.1
    type: PGDReconLoss
  n_steps: 1
  slow_every: 10000
  slow_on_first_step: false
pd:
  batch_size: 16
  ci_config:
    fn_type: global_shared_transformer
    hidden_dims: null
    mode: global
    simple_transformer_ci_cfg:
      attn_config:
        max_len: 1024
        n_heads: 32
        rope_base: 10000.0
      d_model: 4096
      mlp_hidden_dim:
      - 16384
      n_blocks: 8
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: null
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 0.0001
      warmup_pct: 0.0
    weight_decay: 0.0
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 0.01
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 0.0005
      warmup_pct: 0.0
    weight_decay: 0.0
  decomposition_targets:
  - C: 1024
    module_pattern: h.*.attn.q_proj
  - C: 1024
    module_pattern: h.*.attn.k_proj
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_steps: 400
  faithfulness_warmup_weight_decay: 0.0
  identity_decomposition_targets: null
  losses:
    faith:
      coeff: 100000000.0
      type: FaithfulnessLoss
    imp:
      beta: 0.5
      coeff: 4.0e-05
      eps: 1.0e-12
      p_anneal_end_frac: 1.0
      p_anneal_final_p: 0.3
      p_anneal_start_frac: 0.0
      pnorm: 2.0
      type: ImportanceMinimalityLoss
    ppgd:
      coeff: 1.0
      n_samples: 1
      n_warmup_steps: 2
      optimizer:
        beta1: 0.5
        beta2: 0.99
        eps: 1.0e-08
        lr_schedule:
          final_val_frac: 1.0
          fn_type: constant
          start_val: 0.01
          warmup_pct: 0.05
        type: adam
      scope:
        type: per_batch_per_position
      start_frac: 0.0
      type: PersistentPGDReconLoss
      use_sigmoid_parameterization: false
    stoch:
      coeff: 50.0
      type: StochasticReconLayerwiseLoss
  n_mask_samples: 1
  sampling: continuous
  seed: 0
  sigmoid_type: leaky_hard
  steps: 200000
  tied_weights: null
  use_delta_component: true
resume_provenance: null
