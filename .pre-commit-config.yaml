repos:
  # If you want branch protection for the main branch, use this hook
  # - repo: https://github.com/pre-commit/pre-commit-hooks
  #   rev: v4.5.0
  #   hooks:
  #     - id: no-commit-to-branch
  #       args: ["--branch=main"]
  #       stages:
  #         - commit
  - repo: local
    hooks:
      - id: format
        name: Ruff lint and format
        entry: make format
        language: system
        types: [python]
        stages:
          - pre-commit

      - id: type
        name: "Type check with BasedPyright"
        entry: make type
        language: system
        types: [python]
        stages:
          - pre-commit

      # The `type` hook above runs the torch venv's basedpyright, which excludes the JAX
      # distribution. This runs the JAX venv's basedpyright over `jax_single_pool/` so the
      # JAX side can't regress (`make check-jax`).
      - id: type-jax
        name: "Type check JAX with BasedPyright"
        entry: make check-jax
        language: system
        files: ^param_decomp_jax/
        pass_filenames: false
        stages:
          - pre-commit
