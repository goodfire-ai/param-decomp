# FAITH-ONLY variant of p-8e2380e2 (jax-full32L-seq512-b512-dp128-8chunk-attnC4096):
# identical target / sites / C / CI-fn arch / optimizers / steps, but the ONLY live
# training loss is FaithfulnessLoss (og coeff 1e7). ImportanceMinimalityLoss stays in
# the config at coeff 0.0 (build_loss_terms requires the singleton; zero grads freeze
# the CI fn at init); ChunkwiseSubsetReconLoss + PersistentPGDReconLoss are DROPPED
# (requires the experiment/faith-only recon.py edit allowing an empty recon set).
# Purpose: measure where eval/ce_kl/kl_unmasked lands when NOTHING shapes the residual
# W - sum(UV) except mean-square weight regression. dp 128 -> 32, batch 512 -> 128,
# eval batch 256 -> 32 (faith is data-independent; batch only feeds eval + the frozen
# CI fn), save cadence 10000/keep-1 (diagnostic run, full32L ckpts are ~1.3 TB).
run_name: jax-full32L-FAITHONLY-b128-dp32
cadence:
  keep_last_n_checkpoints: 1
  save_every: 10000
  train_log_every: 25
data:
  buffer_size: 1000
  column_name: input_ids
  data_files: /mnt/data/artifacts/mechanisms/param-decomp/datasets/fineweb_llama_tok_512/*.parquet
  dataset_name: parquet
  eval_split: train
  is_tokenized: true
  max_seq_len: 512
  revision: null
  shuffle_each_epoch: true
  streaming: false
  tokenizer_name: meta-llama/Llama-3.1-8B
  train_split: train
eval:
  batch_size: 32
  every: 1000
  metrics:
  - n_batches_accum: 1
    type: CIHistograms
  - ci_alive_threshold: 0.0
    type: ComponentActivationDensity
  - ci_alive_threshold: 0.0
    groups: null
    type: CI_L0
  - rounding_threshold: 0.0
    type: CEandKLLosses
  - type: CIMeanPerComponent
  - coeff: null
    type: StochasticHiddenActsReconLoss
  - type: CIHiddenActsReconLoss
  - coeff: null
    init: random
    mask_scope: shared_across_batch
    n_steps: 20
    step_size: 0.1
    type: PGDReconLoss
  n_steps: 1
  slow_every: 100000
  slow_on_first_step: false
pd:
  batch_size: 128
  ci_config:
    type: chunkwise_transformer
    blocks_per_chunk: 1
    d_model: 4096
    n_blocks: 4
    n_heads: 64
    mlp_hidden: 16384
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 1.0
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 2.83e-05
      warmup_pct: 0.0
    weight_decay: 0.0
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 1.0
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 2.83e-05
      warmup_pct: 0.0
    weight_decay: 0.0
