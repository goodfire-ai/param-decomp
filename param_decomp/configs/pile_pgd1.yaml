# Fresh-PGD pile run — JAX counterpart of Dan's torch p-af354eb1 (pgd1step-ss1.0)
# via the shared-config route. See the referenced yaml's header for the documented
# edits. Small target (4L d768): no remat needed. Launch: pd-lm, 1 node.
run_name: jax-pile4l-pgd1-ss1
# JAX leg of Dan's fresh-PGD pile experiment — byte-derived from the stored config of
# torch run p-af354eb1 ("pgd1step-ss1.0", the relaunch of p-a005ed60; snapshot
# runs/p-af354eb1/experiment_config.yaml). Target: LlamaSimpleMLP 4L pile model
# (t-9d2b8f02), all h.* sites, per-site C, PGDRecon n_steps=1 step_size=1
# unique_per_datapoint (-> bsc). DOCUMENTED EDITS vs upstream:
#   1. data: streaming HF danbraunai/pile-uncopyrighted-tok-shuffled -> the staged
#      parquet artifact (datasets/pile_neox_tok_512; same dataset, same seq 512 —
#      the JAX trainer reads pre-tokenized parquet shards only).
#   2. data.eval_split: val -> train (parquet loading exposes a single "train"
#      split; the staged _val dir exists for ad-hoc use but the loaders don't
#      address it).
#   3. cadence.save_every: null -> 5000, keep_last null -> 2 (upstream saves
#      nothing; the JAX leg checkpoints for requeue-resume + offline eval).
# Everything else (pd losses/optimizers/CI fn, 400k steps, batch 64, eval set) is
# upstream-identical.
cadence:
  keep_last_n_checkpoints: 2
  save_every: 5000
  train_log_every: 200
data:
  buffer_size: 1000
  column_name: input_ids
  data_files: /mnt/data/artifacts/mechanisms/param-decomp/datasets/pile_neox_tok_512/*.parquet
  dataset_name: parquet
  eval_split: train
  is_tokenized: true
  max_seq_len: 512
  revision: null
  shuffle_each_epoch: true
  streaming: false
  tokenizer_name: EleutherAI/gpt-neox-20b
  train_split: train
eval:
  batch_size: 128
  every: 1000
  metrics:
  - n_batches_accum: 1
    type: CIHistograms
  - type: ComponentActivationDensity
  - groups:
      layer_0:
      - h.0.*
      layer_1:
      - h.1.*
      layer_2:
      - h.2.*
      layer_3:
      - h.3.*
      total:
      - '*'
    type: CI_L0
  - rounding_threshold: 0.0
    type: CEandKLLosses
  - type: CIMeanPerComponent
  - coeff: null
    type: StochasticHiddenActsReconLoss
  - type: CIHiddenActsReconLoss
  - coeff: null
    init: random
    mask_scope: shared_across_batch
    n_steps: 20
    name: PGDReconLoss_20step
    step_size: 0.1
    type: PGDReconLoss
  n_steps: 1
  slow_every: 10000
  slow_on_first_step: true
pd:
  batch_size: 64
  ci_config:
    type: chunkwise_transformer
    blocks_per_chunk: 1
    d_model: 2048
    n_blocks: 8
    n_heads: 16
    mlp_hidden: 8192
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: null
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 5.0e-05
      warmup_pct: 0.0
    weight_decay: 0.0
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 0.01
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 5.0e-05
      warmup_pct: 0.0
    weight_decay: 0.0
  decomposition_targets:
  - C: 3072
    module_pattern: h.*.mlp.c_fc
  - C: 3584
    module_pattern: h.*.mlp.down_proj
  - C: 512
    module_pattern: h.*.attn.q_proj
  - C: 512
    module_pattern: h.*.attn.k_proj
  - C: 1024
    module_pattern: h.*.attn.v_proj
  - C: 1024
    module_pattern: h.*.attn.o_proj
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_steps: 400
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - frequency:
      coeff: 1.0e-04
      reference_token_count: 65536
    coeff: 0.0002
    eps: 1.0e-12
    p_anneal_end_frac: 1.0
    p_anneal_final_p: 0.4
    p_anneal_start_frac: 0.0
    pnorm: 2.0
    type: ImportanceMinimalityLoss
  - coeff: 0.5
    routing:
      type: uniform_k_subset
    type: StochasticReconSubsetLoss
  - coeff: 0.5
    init: random
    mask_scope: unique_per_datapoint
    n_steps: 1
    step_size: 1.0
    type: PGDReconLoss
  - coeff: 10000000.0
    type: FaithfulnessLoss
  seed: 0
  steps: 400000
runtime:
  remat_recon_forwards: false
  dp: 16
target:
  output_extract: 0
  weights_dtype: bfloat16
  spec:
    kind: pretrained
    model_class: param_decomp_lab.experiments.lm.pretrain.models.llama_simple_mlp.LlamaSimpleMLP
    run_path: goodfire/spd/runs/t-9d2b8f02
wandb:
  entity: null
  project: param-decomp
