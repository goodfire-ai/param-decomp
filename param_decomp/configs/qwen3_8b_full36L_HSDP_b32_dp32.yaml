# Qwen3-8B-Base full-model decomposition: ALL 36 layers x 7 matrices
# (q/k/v/o/gate/up/down) = 252 sites. Mirrors llama8b_full32L_HSDP_b32_dp32.yaml —
# same algorithm, CI arch, LRs/coeffs/eval set. DELIBERATE DIFFS vs that reference:
#   1. target: Qwen/Qwen3-8B-Base (36 layers, intermediate 12288, vocab 151936,
#      QK-norm). Same per-kind C as the llama config — gate/up/down are ~15% smaller
#      matrices here, so this is a slightly RICHER decomposition per parameter; retune
#      per-kind C once a first run gives signal.
#   2. ChunkwiseSubsetReconLoss sites_per_chunk: 56 -> 63 (9 layers/chunk -> 4 chunks
#      over 36 layers); coeff stays 0.5 x n_chunks = 2.0.
#   3. data: fineweb_qwen3_tok_512 (fineweb re-tokenized with the Qwen3 tokenizer —
#      prestage via `python -m param_decomp_lab.experiments.lm.prestage_tokenized
#      --out_dir .../datasets/fineweb_qwen3_tok_512 --tokenizer_name Qwen/Qwen3-8B-Base
#      --seq_len 512` before first launch).
# out_dir / run_id are minted by pd-lm.
run_name: jax-qwen3-full36L-HSDP-b32-dp32
cadence:
  keep_last_n_checkpoints: 2
  save_every: 5000
  train_log_every: 25
data:
  buffer_size: 1000
  column_name: input_ids
  data_files: /mnt/data/artifacts/mechanisms/param-decomp/datasets/fineweb_qwen3_tok_512/*.parquet
  dataset_name: parquet
  eval_split: train
  is_tokenized: true
  max_seq_len: 512
  revision: null
  shuffle_each_epoch: true
  streaming: false
  tokenizer_name: Qwen/Qwen3-8B-Base
  train_split: train
eval:
  batch_size: 32
  every: 1000
  metrics:
  - n_batches_accum: 1
    type: CIHistograms
  - ci_alive_threshold: 0.0
    type: ComponentActivationDensity
  - ci_alive_threshold: 0.0
    groups: null
    type: CI_L0
  - rounding_threshold: 0.0
    type: CEandKLLosses
  - type: CIMeanPerComponent
  - coeff: null
    type: StochasticHiddenActsReconLoss
  - type: CIHiddenActsReconLoss
  - coeff: null
    init: random
    mask_scope: c
    n_steps: 20
    step_size: 0.1
    type: PGDReconLoss
  n_steps: 1
  slow_every: 10000
  slow_on_first_step: true
pd:
  batch_size: 32
  ci_config:
    type: chunkwise_transformer
    blocks_per_chunk: 1
    d_model: 4096
    n_blocks: 4
    n_heads: 64
    mlp_hidden: 16384
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: null
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 2.0e-05
      warmup_pct: 0.0
    weight_decay: 0.0
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 0.01
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 2.0e-05
      warmup_pct: 0.0
    weight_decay: 0.0
  decomposition_targets:
  - C: 2048
    module_pattern: model.layers.0.self_attn.q_proj
  - C: 2048
    module_pattern: model.layers.0.self_attn.k_proj
  - C: 4096
    module_pattern: model.layers.0.self_attn.v_proj
  - C: 4096
    module_pattern: model.layers.0.self_attn.o_proj
  - C: 8192
    module_pattern: model.layers.0.mlp.gate_proj
  - C: 8192
    module_pattern: model.layers.0.mlp.up_proj
  - C: 10240
    module_pattern: model.layers.0.mlp.down_proj
  - C: 2048
    module_pattern: model.layers.1.self_attn.q_proj
  - C: 2048
    module_pattern: model.layers.1.self_attn.k_proj
  - C: 4096
