# Layer-18-only decomposition of Llama-3.1-8B: JUST layer 18's 7 matrices
# (q/k/v/o/gate/up/down), every per-matrix C DOUBLED vs the full-model config.
# Trimmed from llama8b_full32L_HSDP_b128_dp32.yaml (224 sites -> 7); single chunk.
# out_dir / run_id are minted by pd-lm.
run_name: jax-l18only-doubleC-b128-dp32
cadence:
  keep_last_n_checkpoints: 2
  save_every: 1000
  train_log_every: 25
data:
  buffer_size: 1000
  column_name: input_ids
  data_files: /mnt/data/artifacts/mechanisms/param-decomp/datasets/fineweb_llama_tok_512/*.parquet
  dataset_name: parquet
  eval_split: train
  is_tokenized: true
  max_seq_len: 512
  revision: null
  shuffle_each_epoch: true
  streaming: false
  tokenizer_name: meta-llama/Llama-3.1-8B
  train_split: train
eval:
  batch_size: 32
  every: 1000
  metrics:
  - n_batches_accum: 1
    type: CIHistograms
  - ci_alive_threshold: 0.0
    type: ComponentActivationDensity
  - ci_alive_threshold: 0.0
    groups: null
    type: CI_L0
  - rounding_threshold: 0.0
    type: CEandKLLosses
  - type: CIMeanPerComponent
  - coeff: null
    type: StochasticHiddenActsReconLoss
  - type: CIHiddenActsReconLoss
  - coeff: null
    init: random
    mask_scope: c
    n_steps: 20
    step_size: 0.1
    type: PGDReconLoss
  n_steps: 1
  slow_every: 100000
  slow_on_first_step: false
pd:
  batch_size: 128
  ci_config:
    type: chunkwise_transformer
    blocks_per_chunk: 1
    d_model: 4096
    n_blocks: 4
    n_heads: 64
    mlp_hidden: 16384
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: null
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 2.83e-05
      warmup_pct: 0.0
    weight_decay: 0.0
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 0.01
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 2.83e-05
      warmup_pct: 0.0
    weight_decay: 0.0
  decomposition_targets:
  - C: 4096
    module_pattern: model.layers.18.self_attn.q_proj
  - C: 4096
    module_pattern: model.layers.18.self_attn.k_proj
  - C: 8192
    module_pattern: model.layers.18.self_attn.v_proj
  - C: 8192
    module_pattern: model.layers.18.self_attn.o_proj
  - C: 16384
    module_pattern: model.layers.18.mlp.gate_proj
  - C: 16384
    module_pattern: model.layers.18.mlp.up_proj
  - C: 20480
    module_pattern: model.layers.18.mlp.down_proj
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_steps: 0
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - frequency:
      coeff: 1.0e-06
      reference_token_count: 65536
    coeff: 5.0e-06
    eps: 1.0e-06
    p_anneal_end_frac: 1.0
    p_anneal_final_p: 0.4
    p_anneal_start_frac: 0.0
    pnorm: 2.0
    type: ImportanceMinimalityLoss
  - coeff: 0.5
    n_samples: 1
    routing:
      type: uniform_k_subset
    sites_per_chunk: 7
    type: ChunkwiseSubsetReconLoss
  - coeff: 0.5
    n_warmup_steps: 2
    optimizer:
      beta1: 0.01
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        final_val_frac: 1.0
        fn_type: constant
        start_val: 0.01
        warmup_pct: 0.025
      type: adam
    scope:
      type: bsc
    type: PersistentPGDReconLoss
  - coeff: 1000000.0
    type: FaithfulnessLoss
  seed: 0
  steps: 50000
runtime:
  dp: 32
  tp: 1
  remat_recon_forwards: true
  remat_ci_fn: true
target:
  output_extract: logits
  weights_dtype: bfloat16
  spec:
    kind: hf
    model_class: transformers.LlamaForCausalLM
    model_name: meta-llama/Llama-3.1-8B
wandb:
  entity: null
  project: param-decomp-llama
  group: l18only
  tags:
  - l18
  - single-layer
  - doubleC
  - dp32
