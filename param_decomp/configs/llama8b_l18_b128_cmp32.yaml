# The shared-config route: this wrapper carries only what the torch schema can't
# express (run identity + the jax-runtime remat knob); everything else comes from the
# referenced torch LMExperimentConfig yaml via param-decomp-config. Semantically the
# same run as llama8b_l18_b128_cmp32.yaml — the converter test asserts that.
run_name: jax-l18-b128-cmp32-from-torch
# torch leg of the torch-vs-JAX same-config comparison (32 GPU / 4 nodes each side).
# Single-pool core Trainer (param_decomp/optimize.py) with the SPEC §2 production
# constants (= lr_mid), full-model forward (no residual-start on this path), vendored
# Llama, pre-tokenized fineweb (no HF at run time). JAX leg:
# pd-nano-jax param_decomp/configs/llama8b_l18_b128_cmp32.yaml — same constants,
# same wandb keys (train/loss/*). At L18 (one 3-site chunk) StochasticReconSubsetLoss
# is exactly the JAX chunkwise-subset recon.
# Launch: pd-lm param_decomp_lab/experiments/lm/_llama8b/llama8b_l18_b128_cmp32_1pool.yaml --dp 32
pd:
  seed: 0
  ci_config:
    type: chunkwise_transformer
    blocks_per_chunk: 1
    d_model: 4096
    n_blocks: 4
    n_heads: 64
    mlp_hidden: 16384
  decomposition_targets:
  - module_pattern: layers.18.mlp.gate_proj
    C: 24576
  - module_pattern: layers.18.mlp.up_proj
    C: 24576
  - module_pattern: layers.18.mlp.down_proj
    C: 24576
  components_optimizer:
    lr_schedule:
      start_val: 1.5e-04
      warmup_pct: 0.0
      final_val_frac: 0.1
      fn_type: cosine
    grad_clip_norm: 0.01
    betas:
    - 0.9
    - 0.999
    weight_decay: 0.0
  ci_fn_optimizer:
    lr_schedule:
      start_val: 5.0e-05
      warmup_pct: 0.0
      final_val_frac: 0.1
      fn_type: cosine
    grad_clip_norm: null
    betas:
    - 0.9
    - 0.999
    weight_decay: 0.0
  steps: 5000
  batch_size: 128
  faithfulness_warmup_steps: 400
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - type: FaithfulnessLoss
    coeff: 100000.0
  - type: ImportanceMinimalityLoss
    coeff: 5.0e-06
    pnorm: 2.0
    frequency:
      coeff: 1.0e-06
      reference_token_count: 262144
    p_anneal_start_frac: 0.0
    p_anneal_final_p: 0.4
    p_anneal_end_frac: 1.0
    eps: 1.0e-12
  - type: StochasticReconSubsetLoss
    coeff: 0.5
    routing:
      type: uniform_k_subset
  - type: PersistentPGDReconLoss
    coeff: 0.5
    n_warmup_steps: 2
    optimizer:
      type: adam
      beta1: 0.5
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        start_val: 0.01
        warmup_pct: 0.025
        final_val_frac: 1.0
        fn_type: constant
    scope:
      type: broadcast_across_batch
cadence:
  train_log_every: 20
  save_every: 1000
  keep_last_n_checkpoints: 2
target:
  spec:
    kind: hf_weights_in_vendored
    model_class: param_decomp_lab.experiments.lm.vendored.llama_3_1.model.VendoredLlama
    model_name: meta-llama/Llama-3.1-8B
  output_extract: 0
  activation_checkpointing: true
  weights_dtype: bfloat16
data:
  tokenizer_name: meta-llama/Llama-3.1-8B
  max_seq_len: 2048
  buffer_size: 1000
  dataset_name: parquet
  data_files: /mnt/data/artifacts/mechanisms/param-decomp/datasets/fineweb_llama_tok_2048/*.parquet
  revision: null
  column_name: input_ids
  train_split: train
  eval_split: train
  shuffle_each_epoch: true
  is_tokenized: true
  streaming: false
runtime:
  remat_recon_forwards: true
  dp: null
wandb:
  project: param-decomp-llama
  entity: goodfire
