# PPGD-merge follow-up, arm B-PS (MERGED, per-sample assignment): identical to the
# merged arm except assignment: per_sample — one Bernoulli per batch element, so a
# sequence is all-adversarial or all-stochastic — no mask-family mixing within a sample
# (Braun, task recon-pass-consolidation-results). Same seed/data/CI as the original
# A/B arms for a paired comparison — except seed 1 (seed-noise guard).
run_name: pile4l-merge-ab-merged-persample-400k-s1
cadence:
  keep_last_n_checkpoints: 2
  save_every: 5000
  train_log_every: 200
data:
  buffer_size: 1000
  column_name: input_ids
  # pd-user-readable staging of the same HF dataset (danbraunai/pile-uncopyrighted-tok-shuffled);
  # the canonical /mnt/data/.../pile_neox_tok_512 copy is group-locked to goodfire, which the
  # crew user is not in.
  data_files: /mnt/home/pd-user/param-decomp-runs/datasets/pile_neox_tok_512/data/*.parquet
  dataset_name: parquet
  eval_split: train
  is_tokenized: true
  max_seq_len: 512
  revision: null
  shuffle_each_epoch: true
  streaming: false
  tokenizer_name: EleutherAI/gpt-neox-20b
  train_split: train
eval:
  batch_size: 128
  every: 1000
  metrics:
  - n_batches_accum: 1
    type: CIHistograms
  - ci_alive_threshold: 0.0
    type: ComponentActivationDensity
  - ci_alive_threshold: 0.0
    groups:
      layer_0:
      - h.0.*
      layer_1:
      - h.1.*
      layer_2:
      - h.2.*
      layer_3:
      - h.3.*
      total:
      - '*'
    type: CI_L0
  - rounding_threshold: 0.0
    type: CEandKLLosses
  - type: CIMeanPerComponent
  - coeff: null
    type: StochasticHiddenActsReconLoss
  - type: CIHiddenActsReconLoss
  - coeff: null
    init: random
    mask_scope: c
    n_steps: 20
    name: PGDReconLoss_20step
    step_size: 0.1
    type: PGDReconLoss
  n_steps: 1
  slow_every: 10000
  slow_on_first_step: true
pd:
  batch_size: 64
  ci_config:
    type: chunkwise_transformer
    blocks_per_chunk: 1
    d_model: 1024
    n_blocks: 4
    n_heads: 8
    mlp_hidden: 4096
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: null
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 5.0e-05
      warmup_pct: 0.0
    weight_decay: 0.0
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 0.01
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 5.0e-05
      warmup_pct: 0.0
    weight_decay: 0.0
  decomposition_targets:
  - C: 3072
    module_pattern: h.*.mlp.c_fc
  - C: 3584
    module_pattern: h.*.mlp.down_proj
  - C: 512
    module_pattern: h.*.attn.q_proj
  - C: 512
    module_pattern: h.*.attn.k_proj
  - C: 1024
    module_pattern: h.*.attn.v_proj
  - C: 1024
    module_pattern: h.*.attn.o_proj
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_steps: 400
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - frequency:
      coeff: 0.0001
      reference_token_count: 65536
    coeff: 0.0002
    gamma:
      start_val: 1.0
      fn_type: linear
      final_val_frac: 0.01
    type: SmoothL0ImportanceMinimalityLoss
  - type: MergedStochasticPGDReconLoss
    assignment: per_sample
    coeff: 1.0
    adv_fraction: 0.5
    routing:
      type: uniform_k_subset
    optimizer:
      beta1: 0.5
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        final_val_frac: 1.0
        fn_type: constant
        start_val: 0.01
        warmup_pct: 0.025
      type: adam
    scope:
      type: bsc
    n_warmup_steps: 2
  - coeff: 10000000.0
    type: FaithfulnessLoss
  seed: 1
  steps: 400000
runtime:
  remat_recon_forwards: false
  dp: 8
target:
  output_extract: 0
  weights_dtype: bfloat16
  spec:
    kind: pretrained
    model_class: param_decomp_lab.experiments.lm.pretrain.models.llama_simple_mlp.LlamaSimpleMLP
    run_path: goodfire/spd/runs/t-9d2b8f02
wandb:
  entity: null
  project: param-decomp
