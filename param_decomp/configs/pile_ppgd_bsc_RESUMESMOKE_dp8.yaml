# Save->resume smoke for the checkpoint decomposition|training split (bridge task
# checkpoint-split-decomposition-item). pile_ppgd_bsc.yaml (persistent bsc adversary --
# the training-item subtree that motivated the split) shrunk to dp=8 / 40 steps /
# save_every=10 / warmup=5 / evals+wandb off. Procedure: pd-lm launch -> scancel after
# the step-20 save -> pd-lm --run_id resubmit -> expect 'resumed from checkpoint step
# 20' and two-item step dirs (decomposition/ + training/); rm the run dir after.
cadence:
  keep_last_n_checkpoints: 2
  save_every: 10
  train_log_every: 5
data:
  buffer_size: 1000
  column_name: input_ids
  data_files: /mnt/data/artifacts/mechanisms/param-decomp/datasets/pile_neox_tok_512/*.parquet
  dataset_name: parquet
  eval_split: train
  is_tokenized: true
  max_seq_len: 512
  revision: null
  shuffle_each_epoch: true
  streaming: false
  tokenizer_name: EleutherAI/gpt-neox-20b
  train_split: train
eval:
  batch_size: 128
  every: 100000
  metrics:
  - n_batches_accum: 1
    type: CIHistograms
  - ci_alive_threshold: 0.0
    type: ComponentActivationDensity
  - ci_alive_threshold: 0.0
    groups:
      layer_0:
      - h.0.*
      layer_1:
      - h.1.*
      layer_2:
      - h.2.*
      layer_3:
      - h.3.*
      total:
      - '*'
    type: CI_L0
  - rounding_threshold: 0.0
    type: CEandKLLosses
  - type: CIMeanPerComponent
  - coeff: null
    type: StochasticHiddenActsReconLoss
  - type: CIHiddenActsReconLoss
  - coeff: null
    init: random
    mask_scope: c
    n_steps: 20
    name: PGDReconLoss_20step
    step_size: 0.1
    type: PGDReconLoss
  n_steps: 1
  slow_every: 100000
  slow_on_first_step: true
pd:
  batch_size: 64
  ci_config:
    blocks_per_chunk: 1
    d_model: 2048
    mlp_hidden: 8192
    n_blocks: 8
    n_heads: 16
    type: chunkwise_transformer
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: null
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 5.0e-05
      warmup_pct: 0.0
    weight_decay: 0.0
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 0.01
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 5.0e-05
      warmup_pct: 0.0
    weight_decay: 0.0
  decomposition_targets:
  - C: 3072
    module_pattern: h.*.mlp.c_fc
  - C: 3584
    module_pattern: h.*.mlp.down_proj
  - C: 512
    module_pattern: h.*.attn.q_proj
  - C: 512
    module_pattern: h.*.attn.k_proj
  - C: 1024
    module_pattern: h.*.attn.v_proj
  - C: 1024
    module_pattern: h.*.attn.o_proj
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_steps: 5
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - coeff: 0.0002
    eps: 1.0e-12
    frequency:
      coeff: 0.0001
      reference_token_count: 65536
    pnorm:
      final_val_frac: 0.2
      fn_type: linear
      start_val: 2.0
    type: ImportanceMinimalityLoss
  - coeff: 0.5
    routing:
      type: uniform_k_subset
    type: StochasticReconSubsetLoss
  - coeff: 0.5
    n_warmup_steps: 2
    optimizer:
      beta1: 0.5
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        final_val_frac: 1.0
        fn_type: constant
        start_val: 0.01
        warmup_pct: 0.025
      type: adam
    scope:
      type: bsc
    type: PersistentPGDReconLoss
  - coeff: 10000000.0
    type: FaithfulnessLoss
  seed: 0
  steps: 40
run_name: jax-pile4l-ckpt-split-resume-smoke
runtime:
  dp: 8
  remat_recon_forwards: false
target:
  output_extract: 0
  spec:
    kind: pretrained
    model_class: param_decomp_lab.experiments.lm.pretrain.models.llama_simple_mlp.LlamaSimpleMLP
    run_path: goodfire/spd/runs/t-9d2b8f02
  weights_dtype: bfloat16
