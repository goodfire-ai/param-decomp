# TMS 5->2 PD decomposition with one FROZEN identity hidden layer (torch `-id` variant).
# Inserts a frozen `hidden_layers.0` (n_hidden -> n_hidden, identity init) between linear1
# and linear2, adding a third dense decomposition site. The dense site's ground-truth CI
# is the dense pattern (all n_hidden directions live), not the per-feature identity.
# CI fn: layerwise per-site MLP (type=layerwise_mlp, hidden_dims=[50]). Runs on 1 GPU.
run_name: jax-tms-5-2-id
decomposition:
  sites:
    kind: explicit
    sites:
    - name: linear1
      C: 20
    - name: hidden_layers.0
      C: 20
    - name: linear2
      C: 20
  ci:
    type: layerwise_mlp
    hidden_dims:
    - 50
pd:
  seed: 0
  loss_metrics:
  - frequency:
      coeff: 4.0e-04
      reference_token_count: 32768
    coeff: 8.0e-04
    type: SmoothL0ImportanceMinimalityLoss
    gamma:
      start_val: 1.0
      fn_type: linear
      final_val_frac: 0.01
      warmup_pct: 0.0
  - type: MergedStochasticSubsetPPGDReconLoss
    coeff: 1.0
    adv_fraction:
      start_val: 0.5
      fn_type: constant
      final_val_frac: 1.0
      warmup_pct: 0.0
    n_warmup_steps: 2
    routing:
      type: uniform_k_subset
    optimizer:
      beta1: 0.01
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        final_val_frac: 1.0
        fn_type: constant
        start_val: 0.01
        warmup_pct: 0.025
      type: adam
    source_shape: bc
  - type: FaithfulnessLoss
    coeff: 1.0
  batch_size: 4096
  steps: 20000
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 1.0
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 1e-03
      warmup_pct: 0.0
    weight_decay: 0.0
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 1.0
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 1e-03
      warmup_pct: 0.0
    weight_decay: 0.0
  faithfulness_warmup_steps: 200
  faithfulness_warmup_lr: 0.01
  faithfulness_warmup_weight_decay: 0.0
runtime:
  remat_recon_forwards: false
  dp: null
  sharding: ddp
cadence:
  train_log_every: 200
  save_every: 5000
  keep_last_n_checkpoints: 2
target:
  n_features: 5
  n_hidden: 2
  n_hidden_layers: 1
  hidden_layer_init: identity
  init_bias_to_zero: true
  pretrain:
    steps: 5000
    batch_size: 2048
    lr: 1e-2
    seed: 0
data:
  feature_probability: 0.05
  data_generation_type: at_least_zero_active
eval:
  # Toys validate via the ground-truth CI metric; the permuted-CI heatmap logs
  # unconditionally. Toys honor only the permutation/UV figure metrics, so the
  # PGDReconLoss probe (authored by the sweep) and the cadence fields are inert
  # until the toys grow the LM scalar eval pass.
  batch_size: 4096
  n_steps: 1
  every: 1000
  slow_every: 2000
  metrics:
  - type: PGDReconLoss
    coeff: null
    init: random
    source_shape: c
    n_steps: 20
    step_size: 0.1
wandb:
  project: param-decomp-toys
  entity: null
