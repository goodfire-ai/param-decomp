pd:
  seed: 0
  n_mask_samples: 1
  ci_config:
    mode: layerwise
    fn_type: mlp
    hidden_dims:
    - 16
  sigmoid_type: leaky_hard
  module_info:
  - module_pattern: linear1
    C: 20
  - module_pattern: linear2
    C: 20
  use_delta_component: true
  loss_metrics:
    importance_minimality:
      coeff: 3e-3
      pnorm: 1.0
      beta: 0
    stochastic_recon:
      coeff: 1.0
    stochastic_recon_layerwise:
      coeff: 1.0
  batch_size: 4096
  steps: 10000
  components_optimizer:
    lr_schedule:
      start_val: 1e-3
      fn_type: cosine
      warmup_pct: 0.0
      final_val_frac: 0.0
  ci_fn_optimizer:
    lr_schedule:
      start_val: 1e-3
      fn_type: cosine
      warmup_pct: 0.0
      final_val_frac: 0.0
  faithfulness_warmup_steps: 200
  faithfulness_warmup_lr: 0.01
  faithfulness_warmup_weight_decay: 0.1
logging:
  train_log_freq: 100
  eval_freq: 1000
  slow_eval_freq: 5000
  n_eval_steps: 100
  eval_batch_size: 4096
  save_freq: null
  ci_alive_threshold: 0.1
  eval_metrics:
    ci_histograms:
      n_batches_accum: 5
    component_activation_density: {}
    permuted_ci_plots:
      identity_patterns:
      - linear1
      - linear2
      dense_patterns: null
    identity_ci_error:
      identity_ci:
      - layer_pattern: linear1
        n_features: 5
      - layer_pattern: linear2
        n_features: 5
      dense_ci: null
    ci_l0:
      groups: null
    ci_mean_per_component: {}
    stochastic_hidden_acts_recon: {}
target:
  run_path: wandb:goodfire/spd-pre-Sep-2025/runs/0hsp07o4
data:
  feature_probability: 0.05
  data_generation_type: at_least_zero_active
