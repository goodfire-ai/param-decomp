pd:
  wandb_project: param-decomp
  wandb_run_name: null
  seed: 0
  n_mask_samples: 1
  ci_config:
    mode: global
    fn_type: global_shared_mlp
    hidden_dims:
    - 400
    - 300
  sigmoid_type: leaky_hard
  module_info:
  - module_pattern: layers.*.mlp_in
    C: 100
  - module_pattern: layers.*.mlp_out
    C: 100
  identity_module_info: null
  use_delta_component: true
  batch_size: 2048
  eval_batch_size: 2048
  steps: 20000
  components_optimizer:
    lr_schedule:
      start_val: 2e-3
      fn_type: constant
      warmup_pct: 0.0
  ci_fn_optimizer:
    lr_schedule:
      start_val: 2e-3
      fn_type: constant
      warmup_pct: 0.0
  faithfulness_warmup_steps: 200
  faithfulness_warmup_lr: 0.01
  faithfulness_warmup_weight_decay: 0.1
  train_log_freq: 100
  eval_freq: 500
  n_eval_steps: 100
  slow_eval_freq: 5000
  slow_eval_on_first_step: true
  save_freq: null
  ci_alive_threshold: 0.1
  loss_metrics:
    ImportanceMinimalityLoss:
      coeff: 1e-5
      pnorm: 2.0
      beta: 0
    StochasticReconLayerwiseLoss:
      coeff: 1.0
    StochasticReconLoss:
      coeff: 1.0
  eval_metrics:
    CIHistograms:
      n_batches_accum: 5
    ComponentActivationDensity: {}
    PermutedCIPlots:
      identity_patterns:
      - layers.*.mlp_in
      dense_patterns:
      - layers.*.mlp_out
    IdentityCIError:
      identity_ci:
      - layer_pattern: layers.*.mlp_in
        n_features: 100
      dense_ci:
      - layer_pattern: layers.*.mlp_out
        k: 50
    CI_L0:
      groups: null
    CIMeanPerComponent: {}
    StochasticHiddenActsReconLoss: {}
target:
  run_path: wandb:goodfire/spd-pre-Sep-2025/runs/pziyck78
data:
  feature_probability: 0.01
  data_generation_type: at_least_zero_active
