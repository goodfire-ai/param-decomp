pd:
  wandb_project: param-decomp
  wandb_run_name: null
  wandb_run_name_prefix: ''
  seed: 0
  n_mask_samples: 1
  ci_config:
    mode: layerwise
    fn_type: mlp
    hidden_dims:
    - 128
  sigmoid_type: leaky_hard
  module_info:
  - module_pattern: layers.*.mlp_in
    C: 500
  - module_pattern: layers.*.mlp_out
    C: 500
  use_delta_component: true
  batch_size: 2048
  eval_batch_size: 2048
  steps: 50000
  components_optimizer:
    lr_schedule:
      start_val: 1e-3
      fn_type: constant
      warmup_pct: 0.0
  ci_fn_optimizer:
    lr_schedule:
      start_val: 1e-3
      fn_type: constant
      warmup_pct: 0.0
  faithfulness_warmup_steps: 200
  faithfulness_warmup_lr: 0.01
  faithfulness_warmup_weight_decay: 0.1
  train_log_freq: 50
  eval_freq: 500
  n_eval_steps: 100
  slow_eval_freq: 5000
  slow_eval_on_first_step: true
  save_freq: null
  ci_alive_threshold: 0.1
  loss_metrics:
    importance_minimality:
      coeff: 1e-5
      pnorm: 2.0
      beta: 0
    stochastic_recon_layerwise:
      coeff: 1.0
    stochastic_recon:
      coeff: 1.0
  eval_metrics:
    ci_histograms:
      n_batches_accum: 5
    component_activation_density: {}
    permuted_ci_plots:
      identity_patterns:
      - layers.*.mlp_in
      dense_patterns:
      - layers.*.mlp_out
    identity_ci_error:
      identity_ci:
      - layer_pattern: layers.*.mlp_in
        n_features: 102
      dense_ci:
      - layer_pattern: layers.*.mlp_out
        k: 17
    ci_l0:
      groups: null
    ci_mean_per_component: {}
    stochastic_hidden_acts_recon: {}
target:
  run_path: wandb:goodfire/spd-pre-Sep-2025/runs/6hk3uciu
data:
  feature_probability: 0.01
  data_generation_type: at_least_zero_active
