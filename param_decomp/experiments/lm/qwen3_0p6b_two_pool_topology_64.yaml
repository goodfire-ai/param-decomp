# 64-GPU topology for Qwen3-0.6B. Pairs with `qwen3_0p6b.yaml`.
#
# Layout: 56A + 8B = 64 GPUs across 8 nodes.
#   * 28 attn-block-groups (one per layer, q/k/v/o sites, 1 rank each)
#   * 28 mlp-block-groups  (one per layer, gate/up/down sites, 1 rank each)
#   * Pool A = ranks 0..55. Pool B = ranks 56..63.
#
# Each rank owns 4 (attn) or 3 (mlp) sites — same site density as the
# LlamaSimpleMLP-12L 24×2+16 topology. Bigger model (28 layers vs 12,
# d_model 1024 vs 768) → bigger per-step compute → 2-pool's comm
# amortization should help more.
