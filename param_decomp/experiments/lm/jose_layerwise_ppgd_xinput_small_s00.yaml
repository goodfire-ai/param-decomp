- {classname: CEandKLLosses, rounding_threshold: 0.0}
- {classname: CIMeanPerComponent}
- {coeff: null, classname: StochasticHiddenActsReconLoss}
- {classname: CIHiddenActsReconLoss}
- {coeff: null, init: random, step_size: 0.1, n_steps: 20, mask_scope: shared_across_batch,
