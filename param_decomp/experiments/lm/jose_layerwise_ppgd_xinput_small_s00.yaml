  extra_input_module_patterns: [h.0.attn.q_proj, h.0.mlp.c_fc, h.0.mlp.down_proj,
    h.1.attn.q_proj, h.1.mlp.c_fc, h.1.mlp.down_proj, h.3.attn.q_proj, h.3.mlp.c_fc,
    h.3.mlp.down_proj]
sampling: continuous
sigmoid_type: leaky_hard
module_info:
- {module_pattern: h.2.mlp.c_fc, C: 3072}
- {module_pattern: h.2.mlp.down_proj, C: 3584}
- {module_pattern: h.2.attn.q_proj, C: 512}
- {module_pattern: h.2.attn.k_proj, C: 512}
- {module_pattern: h.2.attn.v_proj, C: 1024}
- {module_pattern: h.2.attn.o_proj, C: 1024}
identity_module_info: null
init_pd_checkpoint: null
use_delta_component: true
