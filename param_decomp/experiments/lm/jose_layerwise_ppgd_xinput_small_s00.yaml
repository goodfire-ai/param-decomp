wandb_project: param-decomp
wandb_run_name: null
wandb_run_name_prefix: ''
wandb_group: jose-layerwise-ppgd-xinput-small-random
wandb_tags: [ppgd-xinput-small-random, s00, ppgd, xinput, cisize-small]
extra_wandb_config: {sweep_axis: ppgd_xinput_small_random, sample_id: s00, lr_comp: '1.220e-04',
  lr_ci: '1.103e-05', imp_min_coeff: '1.065e-04', ci_size: small, ci_d_model: '512',
