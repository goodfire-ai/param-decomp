  grad_clip_norm: 0.01
ci_fn_optimizer:
  lr_schedule: {start_val: 1.1027892473628032e-05, warmup_pct: 0.0, final_val_frac: 0.1,
    fn_type: cosine}
steps: 50000
batch_size: 64
faithfulness_warmup_steps: 400
faithfulness_warmup_lr: 0.001
faithfulness_warmup_weight_decay: 0.0
