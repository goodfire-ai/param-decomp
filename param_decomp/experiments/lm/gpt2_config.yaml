pd:
  seed: 0
  n_mask_samples: 1
  ci_config:
    mode: layerwise
    fn_type: vector_mlp
    hidden_dims:
    - 12
  sigmoid_type: leaky_hard
  module_info:
  - module_pattern: transformer.h.1.attn.c_attn
    C: 768
  identity_module_info: null
  sampling: continuous
  use_delta_component: true
  batch_size: 2
  eval_batch_size: 2
  steps: 50000
  components_optimizer:
    lr_schedule:
      start_val: 3e-4
      fn_type: cosine
      warmup_pct: 0.01
      final_val_frac: 0.1
  ci_fn_optimizer:
    lr_schedule:
      start_val: 3e-4
      fn_type: cosine
      warmup_pct: 0.01
      final_val_frac: 0.1
  faithfulness_warmup_steps: 200
  faithfulness_warmup_lr: 0.01
  faithfulness_warmup_weight_decay: 0.1
  train_log_freq: 100
  eval_freq: 1000
  slow_eval_freq: 5000
  slow_eval_on_first_step: true
  n_eval_steps: 5
  save_freq: null
  ci_alive_threshold: 0.0
  loss_metrics:
    importance_minimality:
      coeff: 0.0003
      pnorm: 2.0
      beta: 0
      p_anneal_start_frac: 0.0
      p_anneal_final_p: 0.3
      p_anneal_end_frac: 1.0
    stochastic_recon_layerwise:
      coeff: 2.0
  eval_metrics:
    ci_histograms:
      n_batches_accum: 5
    component_activation_density: {}
    ci_l0:
      groups: null
    ce_and_kl:
      rounding_threshold: 0.0
    ci_mean_per_component: {}
    stochastic_hidden_acts_recon: {}
target:
  model_class: transformers.GPT2LMHeadModel
  model_name: openai-community/gpt2
  model_path: null
  output_extract: logits
data:
  tokenizer_name: openai-community/gpt2
  max_seq_len: 1024
  dataset_name: apollo-research/Skylion007-openwebtext-tokenizer-gpt2
  is_tokenized: true
  column_name: input_ids
  train_split: train
  eval_split: train
