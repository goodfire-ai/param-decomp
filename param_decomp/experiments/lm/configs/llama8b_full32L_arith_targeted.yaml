# TARGETED (tPD, SPEC §11) FULL-MODEL Llama-3.1-8B decomposition on the modular-addition
# target: every layer, every matrix, at low C (the paper's TMCC lesson — the
# decomposition only needs slots for the target mechanisms). CI net: one chunk per 4
# blocks, each the L18 seat's proven per-chunk transformer — ~8.6B aggregate, ~1x the
# target. Streams equal at 32 (paper: equal), sized for a dp-8 start.
run_name: jax-full32L-arith-targeted
decomposition:
  sites:
    kind: glu_transformer
    layers:
      kind: all
    cs:
      q: 128
      k: 128
      v: 128
      o: 128
      gate: 256
      up: 256
      down: 256
  ci:
    type: chunkwise_transformer
    blocks_per_chunk: 4
    d_model: 4096
    n_blocks: 4
    attention:
      kind: mha
      n_heads: 64
    ffn:
      kind: gelu
      hidden: 16384
pd:
  seed: 0
  components_optimizer:
    lr_schedule:
      max_val: 1.5e-04
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    grad_clip_norm: 0.01
    betas:
    - 0.9
    - 0.999
    weight_decay: 0.0
  ci_fn_optimizer:
    lr_schedule:
      max_val: 5.0e-05
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    grad_clip_norm: null
    betas:
    - 0.9
    - 0.999
    weight_decay: 0.0
  steps: 20000
  batch_size: 32
  # Paper: 0.1 weight decay on subcomponent vectors scaled by 1 - max_batch(CI) (T11).
  ci_scaled_weight_decay: 0.1
  loss_metrics:
  - type: ImportanceMinimalityLoss
    # Paper-shaped coeff schedule: warm up over the first 20%, decay to peak/4 (their
    # 4e-3 -> 1e-3); peak = this seat's prior constant.
    coeff:
      max_val: 5.0e-06
      points:
        - {at: 0.0, frac: 0.0}
        - {at: 0.2, frac: 1.0}
        - {at: 1.0, frac: 0.25}
    gamma:
      max_val: 1.0
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.01}
    frequency:
      coeff: 1.0e-06
      reference_datapoint_count: 262144
  - type: StochasticReconSubsetLoss
    coeff: 0.5
    routing:
      type: uniform_k_subset
  - type: PersistentPGDReconLoss
    # Activation gate (paper: PPGD joins after 20% of training; stochastic recon carries
    # the early phase) with a ramp rather than a step: 0 until 20%, full by 30%.
    coeff:
      max_val: 0.5
      points:
        - {at: 0.0, frac: 0.0}
        - {at: 0.2, frac: 0.0}
        - {at: 0.3, frac: 1.0}
        - {at: 1.0, frac: 1.0}
    n_warmup_steps: 2
    optimizer:
      type: adam
      beta1: 0.5
      beta2: 0.99
      eps: 1.0e-08
      # The S24 warmup ascents run coeff-free every step, so the adversary keeps
      # tracking the decomposition through the gated phase and is warm at activation.
      lr_schedule:
        max_val: 0.01
        points:
          - {at: 0.0, frac: 0.0}
          - {at: 0.025, frac: 1.0}
          - {at: 1.0, frac: 1.0}
    source_shape: sc
prompts:
  kind: arithmetic_grid
  operation: add
  a_range: [1, 100]
  b_range: [1, 100]
nontarget:
  batch_size: 32
  # The paper runs off-target imp-min at ~2x the target coeff (fewer active components
  # off-target); authored absolute here, same warmup/decay shape as the target term.
  impmin_coeff:
    max_val: 1.0e-05
    points:
      - {at: 0.0, frac: 0.0}
      - {at: 0.2, frac: 1.0}
      - {at: 1.0, frac: 0.25}
  recon:
  - type: StochasticReconSubsetLoss
    coeff: 1.0
    routing:
      type: uniform_k_subset
cadence:
  train_log_every: 20
  checkpointing:
    kind: periodic
    save_every: 1000
    retention:
      kind: keep_last
      n: 2
target:
  spec:
    kind: hf_weights_in_vendored
    model_class: param_decomp.experiments.lm.vendored.llama_3_1.model.VendoredLlama
    model_name: meta-llama/Llama-3.1-8B
  attention_implementation: auto
  weights_dtype: bfloat16
data:
  train:
    kind: name
    name: fineweb_llama_tok_2048
  eval:
    kind: name
    name: fineweb_llama_tok_2048_eval
runtime:
  compilation_cache_dir: ~/.cache/param-decomp/xla
  remat_recon_forwards: true
  replicate: 1
  fsdp: 8
  tp: 1
  sharding: zero1
  compiler_options: tuned-v1
wandb:
  project: param-decomp-llama
  entity: goodfire
