# Cheap end-to-end save/resume smoke for the full-32L production recipe (CONFIGS.md
# "save-path smoke" seat): the dp64 seat's exact site set / algorithm / CI-fn arch /
# zero1 sharding, scaled to dp 32 (4 nodes) with batch 32 — the production per-rank
# batch of 1 — and 250 steps with save_every 100, so a launch exercises save AND
# resume at the production per-rank shape without a production-length job.
# Memory: this shape's fused recon backward needs ~180GB-class devices (B200) or a
# larger world size — 80GB cards at dp32 run out of memory.
# out_dir / run_id are minted at launch, never authored here.
run_name: jax-full32L-HSDP-savesmoke
cadence:
  train_log_every: 10
  checkpointing:
    kind: periodic
    save_every: 100
    retention:
      kind: keep_last
      n: 2
data:
  train:
    kind: name
    name: fineweb_llama_tok_512
  eval:
    kind: name
    name: fineweb_llama_tok_512_eval1
eval:
  batch_size: 32
  every: 1000
  metrics:
  - n_batches_accum: 1
    type: CIHistograms
  - ci_alive_threshold: 0.0
    type: ComponentActivationDensity
  - ci_alive_threshold: 0.0
    groups: null
    type: CI_L0
  - rounding_threshold: 0.0
    type: CEandKLLosses
  - type: CIMeanPerComponent
  - coeff: null
    type: StochasticHiddenActsReconLoss
  - type: CIHiddenActsReconLoss
  - coeff: null
    init: random
    source_shape: c
    n_steps: 20
    step_size: 0.1
    type: PGDReconLoss
  n_steps: 1
  slow_every: 10000
  slow_on_first_step: true
decomposition:
  sites:
    kind: glu_transformer
    layers:
      kind: all
    cs:
      q: 2048
      k: 2048
      v: 4096
      o: 4096
      gate: 8192
      up: 8192
      down: 10240
  ci:
    type: chunkwise_transformer
    blocks_per_chunk: 1
    d_model: 4096
    n_blocks: 4
    attention:
      kind: mha
      n_heads: 64
    ffn:
      kind: gelu
      hidden: 16384
pd:
  batch_size: 32
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: null
    lr_schedule:
      max_val: 2.0e-05
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    weight_decay: 0.0
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 0.01
    lr_schedule:
      max_val: 2.0e-05
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    weight_decay: 0.0
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_steps: 0
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - frequency:
      coeff: 1.0e-06
      reference_datapoint_count: 65536
    coeff: 5.0e-06
    eps: 1.0e-06
    pnorm:
      max_val: 2.0
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.2}
    type: ImportanceMinimalityLoss
  - coeff: 0.5
    routing:
      type: uniform_k_subset
    type: StochasticReconSubsetLoss
  - coeff: 0.5
    n_warmup_steps: 2
    optimizer:
      beta1: 0.01
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        max_val: 0.01
        points:
          - {at: 0.0, frac: 0.0}
          - {at: 0.025, frac: 1.0}
          - {at: 1.0, frac: 1.0}
      type: adam
    source_shape: bsc
    type: PersistentPGDReconLoss
  - coeff: 1.0e+03
    type: FaithfulnessLoss
  seed: 0
  steps: 250
runtime:
  compilation_cache_dir: ~/.cache/param-decomp/xla
  replicate: 4
  fsdp: 8
  tp: 1
  # the layout production runs (the dp64 seat) — a save/resume smoke must exercise it
  sharding: zero1
  remat_recon_forwards: true
  remat_ci_fn: true
  compiler_options: tuned-v1
target:
  attention_implementation: auto
  weights_dtype: bfloat16
  spec:
    kind: hf
    model_class: transformers.LlamaForCausalLM
    model_name: meta-llama/Llama-3.1-8B
wandb:
  entity: null
  project: param-decomp-llama
  group: full32L
  tags:
  - full-model
  - 32L
  - allmat
  - dp32
  - seq512
