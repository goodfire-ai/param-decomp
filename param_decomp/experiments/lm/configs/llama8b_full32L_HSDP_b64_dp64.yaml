# The full-32L production recipe (CONFIGS.md "llama8b full-model" seat): Llama-3.1-8B,
# ALL 32 layers x 7 matrices (q/k/v/o/gate/up/down) = 224 sites, HSDP tp=1 at dp 64
# (8 nodes), zero1 sharding — validated on H100s.
#
# Derived from the l18-23 6L reference run p-2112148d ("jax-l18-23-6L-ablbase-200k"):
# same algorithm (stochastic subset recon + persistent-PGD + faith + imp-min), same CI
# fn arch, same LRs/coeffs/eval set. How this differs from that reference:
#   1. sites: 224 (all matrices, all 32 layers) vs the reference's 18 (MLP, layers
#      18-23). Per-matrix C from the 2026-06-22 full-llama8b BOTEC, rounded UP to
#      multiples of 128 (the V/U C-axis shards over the mesh; init asserts C % dp == 0):
#      q/k 2048, v/o 4096, gate/up 8192, down 10240. ΣC=1,245,184; V/U=18.3B params
#      (~1.1x the reference's 16.3B — params shard cheaply, not the binding constraint).
#   2. batch 64 at dp 64: per-rank batch 1 (vs the reference's 2).
#   3. StochasticReconSubsetLoss coeff 0.5: one uniform-k forward over all 224 sites
#      per step.
#   4. remat_recon_forwards: true (224 sites' full-network recon forward needs it).
#   5. remat_ci_fn: true (checkpoint the ~31B CI fn; without it the step is the GPU
#      compile wall — ~80 min + near-OOM — since the whole CI forward materialises).
#   6. data seq 512 (fineweb_llama_tok_512_train284), matching the reference's seq.
# out_dir / run_id are minted at launch, never authored here.
run_name: jax-full32L-HSDP-b64-dp64
cadence:
  train_log_every: 25
  checkpointing:
    kind: periodic
    save_every: 5000
    retention:
      kind: keep_last
      n: 2
data:
  train:
    kind: name
    name: fineweb_llama_tok_512_train284
  eval:
    kind: name
    name: fineweb_llama_tok_512_eval1
eval:
  batch_size: 64
  every: 1000
  metrics:
  - n_batches_accum: 1
    type: CIHistograms
  - ci_alive_threshold: 0.0
    type: ComponentActivationDensity
  - ci_alive_threshold: 0.0
    groups: null
    type: CI_L0
  - rounding_threshold: 0.0
    type: CEandKLLosses
  - type: CIMeanPerComponent
  - coeff: null
    init: random
    source_shape: c
    n_steps: 20
    step_size: 0.1
    type: PGDReconLoss
  n_steps: 1
  slow_every: 10000
  slow_on_first_step: true
decomposition:
  sites:
    kind: glu_transformer
    layers:
      kind: all
    cs:
      q: 2048
      k: 2048
      v: 4096
      o: 4096
      gate: 8192
      up: 8192
      down: 10240
  ci:
    type: chunkwise_transformer
    blocks_per_chunk: 1
    d_model: 4096
    n_blocks: 4
    attention:
      kind: mha
      n_heads: 64
    ffn:
      kind: gelu
      hidden: 16384
pd:
  batch_size: 64
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: null
    lr_schedule:
      max_val: 2.0e-05
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    weight_decay: 0.0
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 0.01
    lr_schedule:
      max_val: 2.0e-05
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    weight_decay: 0.0
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_steps: 0
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - frequency:
      coeff: 1.0e-06
      reference_datapoint_count: 65536
    coeff: 5.0e-06
    gamma:
      max_val: 1.0
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.01}
    type: ImportanceMinimalityLoss
  - coeff: 0.5
    routing:
      type: uniform_k_subset
    type: StochasticReconSubsetLoss
  - coeff: 0.5
    n_warmup_steps: 2
    optimizer:
      beta1: 0.01
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        max_val: 0.01
        points:
          - {at: 0.0, frac: 0.0}
          - {at: 0.025, frac: 1.0}
          - {at: 1.0, frac: 1.0}
      type: adam
    source_shape: bsc
    type: PersistentPGDReconLoss
  - coeff: 1.0e+03
    type: FaithfulnessLoss
  seed: 0
  steps: 200000
runtime:
  compilation_cache_dir: ~/.cache/param-decomp/xla
  sharding: zero1
  replicate: 8
  fsdp: 8
  tp: 1
  remat_recon_forwards: true
  remat_ci_fn: true
  compiler_options: tuned-v1
target:
  attention_implementation: auto
  weights_dtype: bfloat16
  spec:
    kind: hf
    model_class: transformers.LlamaForCausalLM
    model_name: meta-llama/Llama-3.1-8B
wandb:
  entity: null
  project: param-decomp-llama
  group: full32L
  tags:
  - full-model
  - 32L
  - allmat
  - dp64
  - seq512
