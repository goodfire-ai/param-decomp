# Current JAX reference for decomposing the 4-layer Pile LlamaSimpleMLP target from
# the VPD paper. This is the launch config of the completed reference run
# https://wandb.ai/goodfire/param-decomp/runs/p-76082aa1, with its dataset path
# made cluster-portable and its data parallelism narrowed to one node; per SPEC D4
# the trajectory is invariant to device count at fixed global batch and seed.
#
# The paper artifact https://wandb.ai/goodfire/spd/runs/s-55ea3f9b remains the
# exact historical PyTorch decomposition. Use this config for new decompositions:
# it carries the current JAX algorithm (global 4-block chunkwise CI, smooth-L0
# importance minimality, and merged stochastic-subset PPGD reconstruction).
#
# Run inside a 1-node allocation (8 GPUs, dp=8):
#   python -m param_decomp.experiments.lm.run param_decomp/experiments/lm/configs/pile_llama_simple_mlp-4L.yaml
run_name: ai-jax-pile4l-ppgd-bsc
cadence:
  train_log_every: 200
  checkpointing:
    kind: periodic
    save_every: 5000
    retention:
      kind: keep_last
      n: 2
data:
  train:
    kind: name
    name: pile_neox_tok_512
  eval:
    kind: name
    name: pile_neox_tok_512_val
eval:
  batch_size: 128
  every: 1000
  metrics:
  - n_batches_accum: 1
    type: CIHistograms
  - ci_alive_threshold: 0.0
    type: ComponentActivationDensity
  - ci_alive_threshold: 0.0
    groups:
      layer_0:
      - h.0.*
      layer_1:
      - h.1.*
      layer_2:
      - h.2.*
      layer_3:
      - h.3.*
      total:
      - '*'
    type: CI_L0
  - rounding_threshold: 0.0
    type: CEandKLLosses
  - type: CIMeanPerComponent
  - coeff: null
    type: StochasticHiddenActsReconLoss
  - type: CIHiddenActsReconLoss
  - coeff: null
    init: random
    source_shape: c
    n_steps: 20
    name: PGDReconLoss_20step
    step_size: 0.1
    type: PGDReconLoss
  n_steps: 1
  slow_every: 10000
  slow_on_first_step: true
decomposition:
  sites:
    kind: simple_mlp
    layers:
      kind: all
    cs:
      q_proj: 768
      k_proj: 768
      v_proj: 1024
      o_proj: 1024
      c_fc: 3072
      down_proj: 3584
  ci:
    type: chunkwise_transformer
    blocks_per_chunk: 4
    input_tap: all_block_resids
    d_model: 2048
    n_blocks: 8
    attention:
      kind: mha
      n_heads: 16
    ffn:
      kind: gelu
      hidden: 8192
pd:
  batch_size: 64
  steps: 400000
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 1.0
    lr_schedule:
      max_val: 5.0e-05
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    weight_decay: 0.0
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 1.0
    lr_schedule:
      max_val: 5.0e-05
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    weight_decay: 0.0
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_steps: 400
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - frequency:
      coeff: 1.0e-04
      reference_datapoint_count: 32768
    coeff: 2.0e-04
    type: SmoothL0ImportanceMinimalityLoss
    gamma:
      max_val: 1.0
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.01}
  - type: MergedStochasticSubsetPPGDReconLoss
    coeff: 1.0
    adv_fraction: 0.5
    n_warmup_steps: 2
    routing:
      type: uniform_k_subset
    optimizer:
      beta1: 0.01
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        max_val: 0.01
        points:
          - {at: 0.0, frac: 0.0}
          - {at: 0.025, frac: 1.0}
          - {at: 1.0, frac: 1.0}
      type: adam
    source_shape: bsc
  - coeff: 1.0e+03
    type: FaithfulnessLoss
runtime:
  compilation_cache_dir: ~/.cache/param-decomp/xla
  remat_recon_forwards: false
  replicate: 1
  fsdp: 8
  tp: 1
  sharding: zero1
  compiler_options: tuned-v1
target:
  attention_implementation: auto
  weights_dtype: bfloat16
  spec:
    kind: pretrained
    model_class: param_decomp.experiments.lm.pretrain.models.llama_simple_mlp.LlamaSimpleMLP
    run_path: goodfire/spd/runs/t-9d2b8f02
wandb:
  entity: null
  project: param-decomp
