# From-scratch 9-layer R&D decomposition of Llama-3.1-8B MLP layers 18-26 (27 targets,
# C=49152, seq 512, B=128, 40k steps). See the referenced schema yaml's header for the
# documented edits vs the C49k single-layer base.
# remat ON: 9 layers' recon forwards need rematerialization.
# AOT memory probe (param_decomp/experiments/mem_probe.py, 64 B200, remat on,
# no buffer donation) per-device peak HBM = temp + args + out, seq 512:
#   B=64  : 144.8 GiB   B=128 : 147.7 GiB   B=256 : 150.3 GiB   (all fit the 180 GiB cap)
# (seq 2048 was 179 GiB at B=64 — over the cliff; seq 512 is what makes 27 sites fit.)
# B=128 chosen: ~32 GiB headroom, lands on the B=128 LR precedent exactly. Probed live at
# MEM_FRACTION 0.92.
run_name: jax-l18-26-9L-seq512-b128-40k
# From-scratch 9-layer R&D decomposition of Llama-3.1-8B MLP layers 18-26 inclusive
# (9 layers x 3 matrices = 27 decomposition_targets). Derived from the single-layer-18
# C49k run (torch/llama8b_l18_C49k_200k_1pool.yaml). DELIBERATE EDITS vs that base:
#   1. decomposition_targets: 3 (layer 18) -> 27 (layers 18..26, gate/up/down each,
#      canonical layer-major order), all C: 49152.
#   2. seq 2048 -> 512 (data -> fineweb_llama_tok_512_train284; ci max_len 2048 -> 512). This is
#      what makes 27 sites fit: the 64-GPU AOT probe puts 9-layer/seq512 at 144.8 GiB
#      (B=64) .. 150.3 GiB (B=256) per device — comfortably under the 180 GiB B200 cap
#      (seq 2048 was 179 GiB at B=64, over the cliff). The ~130 GiB floor is the
#      seq-independent V/U + Adam state; batch barely moves it at seq 512.
#   3. pd.batch_size + eval.batch_size: 512 -> 128 (2/device on the 1-D dp=64 mesh).
#   4. lrs: components 1.5e-4, ci_fn 5.0e-5 — the B=128 precedent exactly (components 3x
#      ci_fn). Both cosine to 0.1x with no warmup, recomputed over 40k.
#   5. importance minimality: the repo-standard Smooth-L0 seat (gamma annealed
#      1.0->0.01). coeff 5e-6 / frequency coeff 1e-6 UNCHANGED vs the base.
#   6. steps 200k -> 40k: short R&D horizon (won't converge; cosine + gamma-anneal recompute
#      over 40k).
# Everything else (StochasticReconSubsetLoss coeff 0.5, PersistentPGDReconLoss coeff 0.5
# source_shape sc, FaithfulnessLoss 1e3, faith warmup, eval metric set,
# target.weights_dtype bfloat16) is identical to the C49k base. remat is on
# (runtime.remat_recon_forwards: true). NOTE: the AOT memory probe above predates the
# all-sites recon term (it measured 3 chunked forwards of 9 live sites); re-probe before
# launching at this shape.
cadence:
  train_log_every: 200
  checkpointing:
    kind: periodic
    save_every: 5000
    retention:
      kind: keep_last
      n: 2
data:
  train:
    kind: name
    name: fineweb_llama_tok_512_train284
  eval:
    kind: name
    name: fineweb_llama_tok_512_eval1
eval:
  batch_size: 128
  every: 1000
  metrics:
  - n_batches_accum: 1
    type: CIHistograms
  - ci_alive_threshold: 0.0
    type: ComponentActivationDensity
  - ci_alive_threshold: 0.0
    groups: null
    type: CI_L0
  - rounding_threshold: 0.0
    type: CEandKLLosses
  - type: CIMeanPerComponent
  - coeff: null
    init: random
    source_shape: c
    n_steps: 20
    step_size: 0.1
    type: PGDReconLoss
  n_steps: 1
  slow_every: 10000
  slow_on_first_step: true
decomposition:
  sites:
    kind: glu_transformer
    layers:
      kind: range
      start: 18
      end: 27
    cs:
      gate: 49152
      up: 49152
      down: 49152
  ci:
    type: chunkwise_transformer
    blocks_per_chunk: 1
    d_model: 4096
    n_blocks: 4
    attention:
      kind: mha
      n_heads: 64
    ffn:
      kind: gelu
      hidden: 16384
pd:
  batch_size: 128
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: null
    lr_schedule:
      max_val: 5.0e-05
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    weight_decay: 0.0
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 0.01
    lr_schedule:
      max_val: 1.5e-04
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    weight_decay: 0.0
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_steps: 400
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - frequency:
      coeff: 1.0e-06
      reference_datapoint_count: 65536
    coeff: 5.0e-06
    gamma:
      max_val: 1.0
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.01}
    type: ImportanceMinimalityLoss
  - coeff: 0.5
    routing:
      type: uniform_k_subset
    type: StochasticReconSubsetLoss
  - coeff: 0.5
    n_warmup_steps: 2
    optimizer:
      beta1: 0.5
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        max_val: 0.01
        points:
          - {at: 0.0, frac: 0.0}
          - {at: 0.025, frac: 1.0}
          - {at: 1.0, frac: 1.0}
      type: adam
    source_shape: sc
    type: PersistentPGDReconLoss
  - coeff: 1.0e+03
    type: FaithfulnessLoss
  seed: 0
  steps: 40000
runtime:
  compilation_cache_dir: ~/.cache/param-decomp/xla
  remat_recon_forwards: true
  replicate: 8
  fsdp: 8
  tp: 1
  # 9 layers: gate/up stack of 18 and down stack of 9 can't tile ÷replicate=8, so
  # `owner` refuses; zero1 shards no stack axis (every master rests intra-matrix).
  sharding: zero1
  compiler_options: tuned-v1
target:
  attention_implementation: auto
  weights_dtype: bfloat16
  spec:
    kind: hf
    model_class: transformers.LlamaForCausalLM
    model_name: meta-llama/Llama-3.1-8B
wandb:
  entity: null
  project: param-decomp-llama
