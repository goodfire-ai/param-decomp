# The shared-config route: this wrapper carries only what the torch schema can't
# express (run identity + the jax-runtime remat knob); everything else comes from the
# referenced torch LMExperimentConfig yaml via param-decomp-config. Semantically the
# same run as llama8b_l18_b128_cmp32.yaml — the converter test asserts that.
run_name: jax-l18-b128-cmp32-from-torch
# torch leg of the torch-vs-JAX same-config comparison (32 GPU / 4 nodes each side).
# Single-pool core Trainer (param_decomp/optimize.py) with the SPEC §2 production
# constants (= lr_mid), full-model forward (no residual-start on this path), vendored
# Llama, pre-tokenized fineweb (no HF at run time). JAX leg:
# pd-nano-jax param_decomp/configs/llama8b_l18_b128_cmp32.yaml — same constants,
# same wandb keys (train/loss/*). At L18 (one 3-site chunk) StochasticReconSubsetLoss
# is exactly the JAX chunkwise-subset recon.
decomposition:
  sites:
    kind: glu_transformer
    layers:
      kind: list
      indices:
      - 18
    cs:
      gate: 24576
      up: 24576
      down: 24576
  ci:
    type: chunkwise_transformer
    blocks_per_chunk: 1
    d_model: 4096
    n_blocks: 4
    attention:
      kind: mha
      n_heads: 64
    ffn:
      kind: gelu
      hidden: 16384
pd:
  seed: 0
  components_optimizer:
    lr_schedule:
      max_val: 1.5e-04
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    grad_clip_norm: 0.01
    betas:
    - 0.9
    - 0.999
    weight_decay: 0.0
  ci_fn_optimizer:
    lr_schedule:
      max_val: 5.0e-05
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    grad_clip_norm: null
    betas:
    - 0.9
    - 0.999
    weight_decay: 0.0
  steps: 5000
  batch_size: 128
  faithfulness_warmup_steps: 400
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - type: FaithfulnessLoss
    coeff: 1.0e+03
  - type: ImportanceMinimalityLoss
    coeff: 5.0e-06
    pnorm:
      max_val: 2.0
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.2}
    frequency:
      coeff: 1.0e-06
      reference_datapoint_count: 262144
    eps: 1.0e-12
  - type: StochasticReconSubsetLoss
    coeff: 0.5
    routing:
      type: uniform_k_subset
  - type: PersistentPGDReconLoss
    coeff: 0.5
    n_warmup_steps: 2
    optimizer:
      type: adam
      beta1: 0.5
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        max_val: 0.01
        points:
          - {at: 0.0, frac: 0.0}
          - {at: 0.025, frac: 1.0}
          - {at: 1.0, frac: 1.0}
    source_shape: sc
cadence:
  train_log_every: 20
  checkpointing:
    kind: periodic
    save_every: 1000
    retention:
      kind: keep_last
      n: 2
target:
  spec:
    kind: hf_weights_in_vendored
    model_class: param_decomp.experiments.lm.vendored.llama_3_1.model.VendoredLlama
    model_name: meta-llama/Llama-3.1-8B
  attention_implementation: auto
  weights_dtype: bfloat16
data:
  train:
    kind: name
    name: fineweb_llama_tok_2048
  eval:
    kind: name
    name: fineweb_llama_tok_2048_eval
runtime:
  compilation_cache_dir: ~/.cache/param-decomp/xla
  remat_recon_forwards: true
  replicate: 1
  fsdp: 1
  tp: 1
  sharding: zero1
  compiler_options: tuned-v1
wandb:
  project: param-decomp-llama
  entity: goodfire
