# The launch config of run p-5926d125
# (https://wandb.ai/goodfire/param-decomp-ss2l-repro/runs/p-5926d125), the current recipe
# for decomposing the same SimpleStories target the paper decomposed in
# https://wandb.ai/goodfire/spd/runs/s-eab2ace8.
run_name: jax-ss2l-ppgd-bsc
cadence:
  train_log_every: 200
  checkpointing:
    kind: periodic
    save_every: 50000
    retention:
      kind: keep_last
      n: 2
data:
  train:
    kind: name
    name: simplestories_train_tok512
  eval:
    kind: name
    name: simplestories_test_tok512
eval:
  batch_size: 128
  every: 2000
  n_steps: 1
  slow_every: 10000
  slow_on_first_step: true
  metrics:
  - type: CIHistograms
    n_batches_accum: 1
  - type: ComponentActivationDensity
    ci_alive_threshold: 0.0
  - type: CI_L0
    ci_alive_threshold: 0.0
    groups:
      layer_0:
      - h.0.*
      layer_1:
      - h.1.*
      total:
      - '*'
  - type: CEandKLLosses
    rounding_threshold: 0.0
  - type: CIMeanPerComponent
  - type: StochasticHiddenActsReconLoss
    coeff: null
  - type: CIHiddenActsReconLoss
  - type: PGDReconLoss
    name: PGDReconLoss_20step
    coeff: null
    init: random
    source_shape: c
    n_steps: 20
    step_size: 0.1
decomposition:
  sites:
    kind: simple_mlp
    layers:
      kind: all
    cs:
      q_proj: 288
      k_proj: 288
      v_proj: 384
      o_proj: 480
      c_fc: 1152
      down_proj: 960
  ci:
    type: chunkwise_transformer
    blocks_per_chunk: 2
    input_tap: all_block_resids
    d_model: 512
    n_blocks: 4
    attention:
      kind: mha
      n_heads: 8
    ffn:
      kind: gelu
      hidden: 2048
pd:
  batch_size: 64
  steps: 400000
  seed: 0
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 1.0
    weight_decay: 0.0
    lr_schedule:
      max_val: 0.0003
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 1.0
    weight_decay: 0.0
    lr_schedule:
      max_val: 0.0003
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_steps: 400
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - type: SmoothL0ImportanceMinimalityLoss
    coeff: 0.000632
    gamma:
      max_val: 1.0
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.01}
    frequency:
      coeff: 0.000316
      reference_datapoint_count: 32768
  - type: MergedStochasticSubsetPPGDReconLoss
    coeff: 1.0
    adv_fraction: 0.5
    n_warmup_steps: 2
    routing:
      type: uniform_k_subset
    optimizer:
      type: adam
      beta1: 0.01
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        max_val: 0.01
        points:
          - {at: 0.0, frac: 0.0}
          - {at: 0.025, frac: 1.0}
          - {at: 1.0, frac: 1.0}
    source_shape: bsc
  - type: FaithfulnessLoss
    coeff: 1.0e+03
runtime:
  compilation_cache_dir: ~/.cache/param-decomp/xla
  replicate: 1
  fsdp: 1
  tp: 1
  sharding: zero1
  remat_recon_forwards: false
  compiler_options: tuned-v1
target:
  attention_implementation: auto
  weights_dtype: bfloat16
  spec:
    kind: pretrained
    model_class: param_decomp.experiments.lm.pretrain.models.llama_simple_mlp.LlamaSimpleMLP
    run_path: goodfire/spd/runs/gf6rbga0
wandb:
  entity: null
  project: param-decomp
