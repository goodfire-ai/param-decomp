# Overnight C49k/200k run (2026-06-10) — JAX counterpart of torch p-19645bf7 via the
# shared-config route. See the referenced yaml's header for the documented edits.
# remat off: AOT-probed to fit at the launch topology (64 GPU, per-rank batch 8).
run_name: jax-l18-C49k-200k
# JAX leg of the C30k/200k run — derived from torch run p-19645bf7
# (wandb goodfire/param-decomp-llama/p-19645bf7, "p-19645bf7_C30k_200ksteps";
# snapshot runs/p-19645bf7/experiment_config.yaml). DOCUMENTED EDITS vs upstream:
#   1. data: streaming raw-text fineweb @ seq 512 -> pre-tokenized parquet @ seq 2048
#      (the JAX trainer reads the staged 2048 artifact; seq length is a REAL
#      hyperparameter change, chosen deliberately — 4x tokens/step vs upstream).
#   2. ci attn max_len: 512 -> 2048 (RoPE table must cover the longer seq).
#   3. PersistentPGDReconLoss scope: per_batch_per_position -> sc (batch-shared
#      sources; deliberate divergence — the JAX trainer implemented sc only at launch).
#   4. cadence.save_every: 25000 -> 5000 (overnight crash costs <=40 min, not 3 h).
#   5. C: 30000 -> 49152 per Oli (2x the b512 run's C=24576; also unlocks a 32-GPU
#      mesh — 30000's gcd with batch 128 capped the mesh at 16).
#   6. pd.batch_size: 128 -> 512 per Oli. NOTE: lrs stay at upstream's 5e-5 (tuned
#      at B=128).
#   7. lrs (components + ci_fn): 5e-5 -> 7e-5 per Oli — a deliberate 1.4x partial
#      bump for the 4x batch (full sqrt scaling would be 2x; chosen NOT to).
# Everything else in pd: (C=30000, lrs 5e-5/5e-5, 200k steps, batch 128, eval set)
# is upstream-identical.
#   8. target.weights_dtype: upstream's fp32 -> bfloat16, halving the frozen target's
#      resident footprint (the dominant resident term at 8B).
cadence:
  train_log_every: 200
  checkpointing:
    kind: periodic
    save_every: 5000
    retention:
      kind: keep_last
      n: 2
data:
  train:
    kind: name
    name: fineweb_llama_tok_2048
  eval:
    kind: name
    name: fineweb_llama_tok_2048_eval
eval:
  batch_size: 512
  every: 1000
  metrics:
  - n_batches_accum: 1
    type: CIHistograms
  - ci_alive_threshold: 0.0
    type: ComponentActivationDensity
  - ci_alive_threshold: 0.0
    groups: null
    type: CI_L0
  - rounding_threshold: 0.0
    type: CEandKLLosses
  - type: CIMeanPerComponent
  - coeff: null
    type: StochasticHiddenActsReconLoss
  - type: CIHiddenActsReconLoss
  - coeff: null
    init: random
    source_shape: c
    n_steps: 20
    step_size: 0.1
    type: PGDReconLoss
  # probe built in-memory at startup from the target tokenizer (defaults: add, a,b in 1..100)
  - type: ArithmeticCIGrid
    probe_metrics:
      ce_kl:
        rounding_threshold: 0.0
      ci_l0:
        ci_alive_threshold: 0.0
        groups: null
      fresh_pgd:
        n_steps: 20
        step_size: 0.1
  n_steps: 1
  slow_every: 10000
  slow_on_first_step: true
decomposition:
  sites:
    kind: glu_transformer
    layers:
      kind: list
      indices:
      - 18
    cs:
      gate: 49152
      up: 49152
      down: 49152
  ci:
    type: chunkwise_transformer
    blocks_per_chunk: 1
    d_model: 4096
    n_blocks: 4
    attention:
      kind: mha
      n_heads: 64
    ffn:
      kind: gelu
      hidden: 16384
pd:
  batch_size: 512
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: null
    lr_schedule:
      max_val: 7.0e-05
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    weight_decay: 0.0
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 0.01
    lr_schedule:
      max_val: 7.0e-05
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.1, interp: cosine}
    weight_decay: 0.0
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_steps: 400
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - frequency:
      coeff: 1.0e-06
      reference_datapoint_count: 1048576
    coeff: 5.0e-06
    eps: 1.0e-12
    pnorm:
      max_val: 2.0
      points:
        - {at: 0.0, frac: 1.0}
        - {at: 1.0, frac: 0.2}
    type: ImportanceMinimalityLoss
  - coeff: 0.5
    routing:
      type: uniform_k_subset
    type: StochasticReconSubsetLoss
  - coeff: 0.5
    n_warmup_steps: 2
    optimizer:
      beta1: 0.5
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        max_val: 0.01
        points:
          - {at: 0.0, frac: 0.0}
          - {at: 0.025, frac: 1.0}
          - {at: 1.0, frac: 1.0}
      type: adam
    source_shape: sc
    type: PersistentPGDReconLoss
  - coeff: 1.0e+03
    type: FaithfulnessLoss
  seed: 0
  steps: 200000
runtime:
  compilation_cache_dir: ~/.cache/param-decomp/xla
  remat_recon_forwards: false
  replicate: 4
  fsdp: 8
  tp: 1
  # L18-only: gate/up stack of 2 and down stack of 1 can't tile ÷replicate=4
  # (dp 32 = 4 nodes), so `owner` refuses; zero1 shards no stack axis.
  sharding: zero1
  compiler_options: tuned-v1
target:
  attention_implementation: auto
  weights_dtype: bfloat16
  spec:
    kind: hf
    model_class: transformers.LlamaForCausalLM
    model_name: meta-llama/Llama-3.1-8B
wandb:
  entity: null
  project: param-decomp-llama
