# Topology + 2-pool loss / PPGD config. Pairs with `qwen3_0p6b.yaml` (the
# regular RunConfig that specifies the model + dataloader + PD knobs).
#
# Layout: 112A + 8B = 120 GPUs across 15 nodes.
#   * 28 attn-block-groups (one per Qwen3 layer, q/k/v/o sites, 2 ranks each)
#   * 28 mlp-block-groups  (one per Qwen3 layer, gate/up/down sites, 2 ranks each)
#   * Pool A = ranks 0..111 (nodes 0..13). Pool B = ranks 112..119 (node 14).
#
# Launch via `param_decomp/scripts/two_pool_benchmark/lm_2pool_launcher.py
#   --run_config param_decomp/experiments/lm/qwen3_0p6b.yaml
#   --topology   param_decomp/experiments/lm/qwen3_0p6b_two_pool_topology.yaml`.
