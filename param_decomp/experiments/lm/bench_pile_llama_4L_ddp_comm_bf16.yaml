wandb_project: param-decomp
wandb_run_name: null
wandb_run_name_prefix: 'bench-ddp-comm-bf16'
seed: 0
autocast_bf16: true
ddp_comm_hook: bf16
n_mask_samples: 1
ci_config:
  mode: global
  fn_type: global_shared_transformer
  hidden_dims: null
  simple_transformer_ci_cfg:
    d_model: 2048
    n_blocks: 8
    mlp_hidden_dim:
    - 8192
    attn_config:
      n_heads: 16
      max_len: 512
      rope_base: 10000.0
sampling: continuous
sigmoid_type: leaky_hard
module_info:
- module_pattern: h.*.mlp.c_fc
  C: 3072
- module_pattern: h.*.mlp.down_proj
  C: 3584
- module_pattern: h.*.attn.q_proj
  C: 512
- module_pattern: h.*.attn.k_proj
  C: 512
- module_pattern: h.*.attn.v_proj
  C: 1024
- module_pattern: h.*.attn.o_proj
  C: 1024
identity_module_info: null
init_pd_checkpoint: null
use_delta_component: true
loss_metric_configs:
- coeff: 0.0002
  classname: ImportanceMinimalityLoss
  pnorm: 2.0
  beta: 0.5
  p_anneal_start_frac: 0.0
  p_anneal_final_p: 0.4
  p_anneal_end_frac: 1.0
  eps: 1.0e-12
- coeff: 0.5
  classname: StochasticReconSubsetLoss
  routing:
    type: uniform_k_subset
- coeff: 0.5
  optimizer:
    type: adam
    beta1: 0.5
    beta2: 0.99
    eps: 1.0e-08
    lr_schedule:
      start_val: 0.01
      warmup_pct: 0.025
      final_val_frac: 1.0
      fn_type: constant
  scope:
    type: per_batch_per_position
  use_sigmoid_parameterization: false
  n_warmup_steps: 2
  classname: PersistentPGDReconLoss
- coeff: 10000000.0
  classname: FaithfulnessLoss
lr_schedule:
  start_val: 5.0e-05
  warmup_pct: 0.0
  final_val_frac: 0.1
  fn_type: cosine
steps: 500
batch_size: 64
grad_clip_norm_components: 0.01
grad_clip_norm_ci_fns: null
faithfulness_warmup_steps: 0
train_log_freq: 50
eval_freq: 99999
eval_batch_size: 256
slow_eval_freq: 99999
n_eval_steps: 1
slow_eval_on_first_step: false
save_freq: null
eval_metric_configs: []
ci_alive_threshold: 0.0
output_extract: 0
pretrained_model_class: param_decomp.pretrain.models.llama_simple_mlp.LlamaSimpleMLP
pretrained_model_path: null
pretrained_model_name: goodfire/spd/runs/t-9d2b8f02
tokenizer_name: EleutherAI/gpt-neox-20b
task_config:
  task_name: lm
  max_seq_len: 512
  buffer_size: 1000
  dataset_name: danbraunai/pile-uncopyrighted-tok-shuffled
  column_name: input_ids
  train_data_split: train
  eval_data_split: val
  shuffle_each_epoch: true
  is_tokenized: true
  streaming: true
