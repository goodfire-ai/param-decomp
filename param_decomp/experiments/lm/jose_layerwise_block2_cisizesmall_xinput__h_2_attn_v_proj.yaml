sampling: continuous
save_freq: null
seed: 0
sigmoid_type: leaky_hard
slow_eval_freq: 5000
slow_eval_on_first_step: true
steps: 50000
task_config: {buffer_size: 1000, column_name: input_ids, dataset_name: danbraunai/pile-uncopyrighted-tok-shuffled,
