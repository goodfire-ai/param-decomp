autocast_bf16: true
batch_size: 64
ci_alive_threshold: 0.0
ci_config:
  fn_type: global_shared_transformer
  hidden_dims: null
  mode: global
  simple_transformer_ci_cfg:
    attn_config: {max_len: 512, n_heads: 8, rope_base: 10000.0}
    d_model: 512
    mlp_hidden_dim: [2048]
    n_blocks: 3
  extra_input_module_patterns: [h.0.attn.q_proj, h.0.mlp.c_fc, h.0.mlp.down_proj,
    h.1.attn.q_proj, h.1.mlp.c_fc, h.1.mlp.down_proj, h.2.attn.q_proj, h.2.mlp.c_fc,
    h.2.mlp.down_proj, h.3.attn.q_proj, h.3.mlp.c_fc, h.3.mlp.down_proj]
