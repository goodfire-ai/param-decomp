    total: ['*']
- {classname: CEandKLLosses, rounding_threshold: 0.0}
- {classname: CIMeanPerComponent}
- {classname: StochasticHiddenActsReconLoss, coeff: null}
- {classname: CIHiddenActsReconLoss}
- {classname: PGDReconLoss, coeff: null, init: random, mask_scope: shared_across_batch,
  n_steps: 20, step_size: 0.1}
extra_wandb_config: {ci_d_model: '512', ci_mlp_hidden: '2048', ci_n_blocks: '3', ci_size: small,
  imp_min_coeff: 2e-4, lr_base: 5e-5, lr_ratio: '3:1', sweep_axis: ci_size, use_xinput: 'true'}
faithfulness_warmup_lr: 0.001
faithfulness_warmup_steps: 400
faithfulness_warmup_weight_decay: 0.0
identity_module_info: null
init_pd_checkpoint: null
loss_metric_configs:
- {beta: 0.5, classname: ImportanceMinimalityLoss, coeff: 2e-4, eps: 1.0e-12, p_anneal_end_frac: 1.0,
  p_anneal_final_p: 0.4, p_anneal_start_frac: 0.0, pnorm: 2.0}
- {classname: StochasticReconLayerwiseLoss, coeff: 1.0}
- {classname: FaithfulnessLoss, coeff: 10000000.0}
module_info:
