# 32-GPU topology for Qwen3-0.6B. Pairs with qwen3_0p6b_smoke_seq*.yaml.
#
# Layout: 28A + 4B = 32 GPUs across 4 nodes.
#   * 28 block groups (one per Qwen3 layer), each rank owns all 7 sites of
#     its layer (q/k/v/o + gate/up/down). 1 rank per group.
#   * Pool A = ranks 0..27. Pool B = ranks 28..31.
#
# Why 4-rank pool B: longer-sequence Qwen smokes need small batch (b=4 or
# b=2) to fit memory; batch must be divisible by N_pool_b. N_pool_b=4
# accommodates b=4 (B_local=1) cleanly.
#
# Trade-off vs the 56A+8B topology: each pool A rank does 7 layerwise
# iters instead of 4 or 3, so per-step compute is higher. Acceptable for
# scale-up validation; the point here is fitting longer sequences.
block_groups:
  - { ranks: [0], owned_sites: ['model.layers.0.self_attn.q_proj', 'model.layers.0.self_attn.k_proj', 'model.layers.0.self_attn.v_proj', 'model.layers.0.self_attn.o_proj', 'model.layers.0.mlp.gate_proj', 'model.layers.0.mlp.up_proj', 'model.layers.0.mlp.down_proj'] }
