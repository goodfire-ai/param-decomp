# Latest canonical run: https://wandb.ai/goodfire/param-decomp/runs/p-03a83fba
# (the attention-pattern KL 2.0 + hidden recon 2.0 recipe).
# This is its pinned launch config with the data layout and width it trained with made
# explicit, a model-only run name and no W&B group/tags. Comments mark where main's
# schema, code or data differs from the run.
run_name: pile-llama-simple-mlp-4L
cadence:
  checkpointing:
    kind: periodic
    save_every: 5000
    retention:
      kind: keep_last
      n: 1
data:
  # p-03a83fba read the token-only `pile_neox_tok_512_rowshuf0` / `_val_rowshuf0`, which
  # main's trainer refuses (new runs read document-aware datasets). This is the
  # document-aware Pile pair, read as whole rows like the run's.
  train:
    kind: name
    name: pile_neox_docs513_r188e502a_eos0_v1_rowshuf0_train
  eval:
    kind: name
    name: pile_neox_docs513_r188e502a_eos0_v1_rowshuf0_val
  layout: unsegmented_tokens
  seq_len: 512
eval:
  batch_size: 128
  every: 1000
  metrics:
  - n_batches_accum: 1
    type: CIHistograms
  - ci_alive_threshold: 0.0
    type: ComponentActivationDensity
  - ci_alive_threshold: 0.0
    groups:
      layer_0:
      - h.0.*
      layer_1:
      - h.1.*
      layer_2:
      - h.2.*
      layer_3:
      - h.3.*
      total:
      - '*'
    type: CI_L0
  - rounding_threshold: 0.0
    type: CEandKLLosses
  - type: CIMeanPerComponent
  - type: CIMaskedAttnPatternsReconLoss
  - type: StochasticAttnPatternsReconLoss
  - type: CIActiveCountsPerPosition
  - init: random
    source_shape: c
    n_steps: 20
    step_size: 0.1
    type: PGDReconLoss
    auxiliaries:
    - name: hidden_acts_reconstruction
      coeff: 0.0
      comparisons:
      - capture: resid.1
        distance: relative_squared_error
      - capture: resid.2
        distance: relative_squared_error
      - capture: resid.3
        distance: relative_squared_error
      - capture: resid.4
        distance: relative_squared_error
  - init: random
    source_shape: c
    # One ascent read out at each step, logged as SlowPGDReconLoss_<n>step. Ladders
    # from earlier versions ran one attack per step and logged as PGDReconLoss_<n>step.
    read_out_steps: [40, 80, 160, 320, 640, 1280]
    step_size: 0.1
    type: SlowPGDReconLoss
  n_steps: 1
  slow_every: 10000
  slow_on_first_step: true
decomposition:
  sites:
    kind: simple_mlp
    layers:
      kind: all
    cs:
      q_proj: 768
      k_proj: 768
      v_proj: 768
      o_proj: 768
      c_fc: 3072
      down_proj: 3072
    initialization: nonlinearity_aligned
  ci:
    type: global_transformer
    component_conditioning:
      kind: affine_clipped_component_activation
      output_scale_init: 1.0
      calibration:
        min_n_tokens: 1048576
    input_tap:
      kind: residual_boundaries
      offsets:
      - 0
      - 1
      - 2
      - 3
      - 4
    d_model: 1088
    n_blocks: 8
    attention:
      kind: mha
      mask: causal
      n_heads: 32
      implementation: xla
      # p-03a83fba spelled this `qk_norm: true`, the same per-head RMSNorm with learned
      # gains.
      qk_norm: rms
    ffn:
      kind: gelu
      hidden: 4352
pd:
  batch_size: 2048
  steps: 100000
  ci_fn_optimizer:
    type: muon
    ns_dtype: bfloat16
    grad_clip_norm: 1.0
    lr_schedule:
      max_val: 0.00028
      points:
      - at: 0.0
        frac: 1.0
      - at: 0.95
        frac: 0.1
        interp: cosine
      - at: 1.0
        frac: 0.1
    weight_decay: 0.1
  components_optimizer:
    type: muon
    ns_dtype: bfloat16
    grad_clip_norm: 1.0
    lr_schedule:
      max_val: 0.00028
      points:
      - at: 0.0
        frac: 1.0
      - at: 0.95
        frac: 0.1
        interp: cosine
      - at: 1.0
        frac: 0.1
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_steps: 0
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - frequency:
      coeff: 4.2e-05
      reference_datapoint_count: 6553600
      ema_halflife_steps: 200
    coeff: 0.0001275
    normalize_at_one: true
    type: ImportanceMinimalityLoss
    gamma:
      max_val: 1.0
      points:
      - at: 0.0
        frac: 1.0
      - at: 0.95
        frac: 0.01
      - at: 1.0
        frac: 0.01
  - type: NonlinearityLocalityLoss
    coeff: 3.0e-05
    relative_threshold:
      max_val: 8.0
      points:
      - at: 0.0
        frac: 1.0
      - at: 0.95
        frac: 0.25
      - at: 1.0
        frac: 0.25
    unit_kind_coefficients:
      neuron: 1.0
      attention_head: 1.0
  - type: MergedStochasticSubsetPooledPPGDReconLoss
    coeff: 1.0
    adv_fraction: 0.9
    n_warmup_steps: 2
    routing:
      type: uniform_k_subset
    optimizer:
      beta1: 0.01
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        max_val: 0.02
        points:
        - at: 0.0
          frac: 0.0
        - at: 0.025
          frac: 1.0
        - at: 1.0
          frac: 1.0
      type: adam
    pool:
      size_per_batch_element: 4
    adversary_objective: term
    auxiliaries:
    # p-03a83fba floored each position's clean energy at 0.01x the capture's median; main's
    # relative_squared_error floors at 1e-8 only, so low-energy positions weigh more here.
    - name: hidden_acts_reconstruction
      coeff: 2.0
      comparisons:
      - capture: h.0.attn.o_proj.out
        distance: relative_squared_error
      - capture: post_attn.0
        distance: relative_squared_error
      - capture: h.0.mlp.down_proj.out
        distance: relative_squared_error
      - capture: resid.1
        distance: relative_squared_error
      - capture: h.1.attn.o_proj.out
        distance: relative_squared_error
      - capture: post_attn.1
        distance: relative_squared_error
      - capture: h.1.mlp.down_proj.out
        distance: relative_squared_error
      - capture: resid.2
        distance: relative_squared_error
      - capture: h.2.attn.o_proj.out
        distance: relative_squared_error
      - capture: post_attn.2
        distance: relative_squared_error
      - capture: h.2.mlp.down_proj.out
        distance: relative_squared_error
      - capture: resid.3
        distance: relative_squared_error
      - capture: h.3.attn.o_proj.out
        distance: relative_squared_error
      - capture: post_attn.3
        distance: relative_squared_error
      - capture: h.3.mlp.down_proj.out
        distance: relative_squared_error
      - capture: resid.4
        distance: relative_squared_error
    - name: attention_patterns
      coeff: 2.0
      comparisons:
      - capture: attn_scores.0
        distance: attention_pattern_kl
      - capture: attn_scores.1
        distance: attention_pattern_kl
      - capture: attn_scores.2
        distance: attention_pattern_kl
      - capture: attn_scores.3
        distance: attention_pattern_kl
  - coeff: 1000.0
    type: FaithfulnessLoss
runtime:
  compilation_cache_dir: ~/.cache/param-decomp/xla
  remat_recon_forwards: false
  remat_ci_fn: false
  mesh:
    replicate: 1
    fsdp: 32
    tp: 1
  sharding: owner
  compiler_options: tuned-v2
target:
  attention_implementation: flash
  weights_dtype: bfloat16
  output_edge:
    kind: materialized
  spec:
    kind: pretrained
    model_class: param_decomp.experiments.lm.pretrain.models.llama_simple_mlp.LlamaSimpleMLP
    run_path: goodfire/spd/runs/t-9d2b8f02
wandb:
  project: param-decomp
