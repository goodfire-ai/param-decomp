pd:
  seed: 0
  n_mask_samples: 1
  ci_config:
    mode: layerwise
    fn_type: vector_mlp
    hidden_dims:
    - 8
  sigmoid_type: leaky_hard
  decomposition_targets:
  - module_pattern: esm.encoder.layer.0.intermediate.dense
    C: 8
  - module_pattern: esm.encoder.layer.0.output.dense
    C: 8
  identity_decomposition_targets: null
  sampling: continuous
  use_delta_component: true
  batch_size: 2
  steps: 4
  components_optimizer:
    lr_schedule:
      start_val: 1e-3
      fn_type: cosine
      warmup_pct: 0.01
      final_val_frac: 0.1
  ci_fn_optimizer:
    lr_schedule:
      start_val: 1e-3
      fn_type: cosine
      warmup_pct: 0.01
      final_val_frac: 0.1
  loss_metrics:
    - type: ImportanceMinimalityLoss
      coeff: 0.0003
      pnorm: 2.0
      beta: 0
    - type: StochasticReconLayerwiseLoss
      coeff: 2.0
    - type: FaithfulnessLoss
      coeff: 1.0
cadence:
  train_log_every: 1
target:
  model_class: transformers.EsmForMaskedLM
  # Use the smallest 8M variant for the smoke YAML; switch to esm2_t30_150M_UR50D
  # (150M, 30 layers, hidden 640) for real runs.
  model_name: facebook/esm2_t6_8M_UR50D
  output_extract: logits
data:
  spec:
    kind: synthetic
    max_seq_len: 16
    vocab_lo: 4
    vocab_hi: 24
runtime:
  autocast_bf16: false
  device: cpu
  dp: null
