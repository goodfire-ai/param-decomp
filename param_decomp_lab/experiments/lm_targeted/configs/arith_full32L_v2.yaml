# FULL-MODEL tPD on arithmetic, v2 — Lucius-aligned (p-8060450f llama-3.1-8b-full32L)
# except where tPD requires otherwise. Changes vs the unconverged v1 (p-57ca9107):
#   grad_clip 0.01/none -> 1.0/1.0 | CI d512/32h/bpc4 -> d512/64h/16384/bpc2 (16 chunks)
#   C mlp 512->512, attn 512->512 (half-Lucius) | steps 20k->60k | +S40 ci-scaled wd
#   0.2 @ start_frac 0.5 (Antoine's tPD value). Kept tPD deltas: two-pass arith target,
#   faith 0 (S36), PersistentPGD sc on target pass (S39), impmin x2 (S37), arith eval.
#   nontarget.batch_size is PER-PROC (64 x 4 = 256 global; target batch rides it = 64).
run_name: arith-full32L-v2
cadence:
  keep_last_n_checkpoints: 3
  save_every: 2000
  train_log_every: 100
data:
  tokenizer_name: meta-llama/Llama-3.1-8B
  prompts_file: param_decomp_lab/experiments/lm_targeted/prompts/arithmetic_add_1_100.txt
  max_seq_len: 16
  add_special_tokens: true
nontarget:
  batch_size: 64
  impmin_coeff_ratio: 2.0
  data:
    dataset_name: parquet
    data_files: /mnt/data/artifacts/mechanisms/param-decomp/datasets/fineweb_llama_tok_64/*.parquet
    column_name: input_ids
    tokenizer_name: meta-llama/Llama-3.1-8B
    max_seq_len: 64
    is_tokenized: true
    streaming: false
    eval_split: train
eval:
  batch_size: 64
  every: 1000
  metrics:
  - ci_alive_threshold: 0.0
    groups: null
    type: CI_L0
  - rounding_threshold: 0.0
    type: CEandKLLosses
  - type: ArithmeticCIGrid
  n_steps: 1
  slow_every: 2000
  slow_on_first_step: false
pd:
  batch_size: 64
  ci_config:
    type: chunkwise_transformer
    blocks_per_chunk: 2
    d_model: 768
    n_blocks: 4
    n_heads: 12
    mlp_hidden: 3072
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 1.0
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 5.0e-05
      warmup_pct: 0.0
    weight_decay: 0.0
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 1.0
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 5.0e-05
      warmup_pct: 0.0
    weight_decay: 0.0
