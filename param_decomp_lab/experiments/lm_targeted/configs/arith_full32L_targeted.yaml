# FULL-MODEL tPD on the arithmetic target: ALL 32 layers x ALL 7 matrices = 224 sites.
# C: MLP 2048 (matched to combo p-b5c41a12), ATTENTION 512 (k/v matrices are rank-1024
# under GQA — 2048 was 2x oversubscribed; Antoine's torch tPD also used ~half MLP C on
# attn). ChunkwiseSubsetReconLoss 8x28 coeff 16 (Lucius p-8060450f); CI d_model 2048
# bpc 4; batch 256 + nontarget seq 512 + SmoothL0 + PersistentPGD sc (S39).
# NOTE dp=32 -> 4 processes: nontarget.batch_size is PER-PROCESS (64 x 4 = 256 global,
# matching the combo run). 256/proc = 1024 global OOM'd jit_step at 191GiB (job 265544),
# same failure as the first L18 full run. Target-pass batch rides data.global_batch =
# nontarget.batch_size raw (=64 here) — seam coupling, to be fixed engine-side.
run_name: arith-full32L-all-targeted
cadence:
  keep_last_n_checkpoints: 3
  save_every: 2000
  train_log_every: 100
data:
  tokenizer_name: meta-llama/Llama-3.1-8B
  prompts_file: param_decomp_lab/experiments/lm_targeted/prompts/arithmetic_add_1_100.txt
  max_seq_len: 16
  add_special_tokens: true
nontarget:
  batch_size: 64
  impmin_coeff_ratio: 2.0
  data:
    dataset_name: parquet
    data_files: /mnt/polished-lake/artifacts/mechanisms/param-decomp/datasets/fineweb_llama_tok_512/*.parquet
    column_name: input_ids
    tokenizer_name: meta-llama/Llama-3.1-8B
    max_seq_len: 512
    is_tokenized: true
    streaming: false
    eval_split: train
eval:
  batch_size: 256
  every: 1000
  metrics:
  - ci_alive_threshold: 0.0
    groups: null
    type: CI_L0
  - rounding_threshold: 0.0
    type: CEandKLLosses
  - type: ArithmeticCIGrid
  n_steps: 1
  slow_every: 2000
  slow_on_first_step: true
pd:
  batch_size: 256
  ci_config:
    type: chunkwise_transformer
    blocks_per_chunk: 4
    d_model: 2048
    n_blocks: 4
    n_heads: 32
    mlp_hidden: 8192
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: null
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 5.0e-05
      warmup_pct: 0.0
    weight_decay: 0.0
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 0.01
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 5.0e-05
      warmup_pct: 0.0
    weight_decay: 0.0
