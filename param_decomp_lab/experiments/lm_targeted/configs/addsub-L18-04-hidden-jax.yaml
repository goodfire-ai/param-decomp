run_name: addsub-L18-04-hidden-jax
cadence:
  keep_last_n_checkpoints: 2
  save_every: 5000
  train_log_every: 100
data:
  tokenizer_name: meta-llama/Llama-3.1-8B
  prompts_file: param_decomp_lab/experiments/lm_targeted/prompts/addition_subtraction_1-100.txt
  max_seq_len: 16
  add_special_tokens: true
nontarget:
  batch_size: 128
  impmin_coeff_ratio: 2.0
  data:
    dataset_name: parquet
    data_files: /mnt/nw/home/a.vigouroux/datasets/fineweb_llama_tok_64/*.parquet
    column_name: input_ids
    tokenizer_name: meta-llama/Llama-3.1-8B
    max_seq_len: 64
    is_tokenized: true
    streaming: false
    eval_split: train
eval:
  batch_size: 128
  every: 500
  n_steps: 10
  slow_every: 1000
  slow_on_first_step: true
  metrics:
  - ci_alive_threshold: 0.0
    groups: null
    type: CI_L0
  - rounding_threshold: 0.0
    type: CEandKLLosses
  - type: ArithmeticCIGrid
  - coeff: null
    init: random
    mask_scope: c
    n_steps: 20
    step_size: 0.1
    type: PGDReconLoss
  - type: WeightMagnitude
  - type: CIMeanPerComponent
  - rounding_threshold: 0.0
    ci_alive_threshold: 0.1
    type: TargetReconLoss
pd:
  batch_size: 128
  ci_config:
    type: chunkwise_transformer
    blocks_per_chunk: 1
    d_model: 512
    n_blocks: 4
    n_heads: 8
    mlp_hidden: 2048
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: null
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 0.00016
      warmup_pct: 0.0
    weight_decay: 0.0
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 0.01
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 0.00032
      warmup_pct: 0.0
    weight_decay: 0.0
  ci_scaled_component_weight_decay: 0.3
  ci_scaled_component_weight_decay_start_frac: 0.0
  decomposition_targets:
  - C: 256
    module_pattern: model.layers.18.mlp.gate_proj
  - C: 256
    module_pattern: model.layers.18.mlp.up_proj
  - C: 256
    module_pattern: model.layers.18.mlp.down_proj
  - C: 64
    module_pattern: model.layers.18.self_attn.q_proj
  - C: 64
    module_pattern: model.layers.18.self_attn.k_proj
  - C: 128
    module_pattern: model.layers.18.self_attn.v_proj
  - C: 128
    module_pattern: model.layers.18.self_attn.o_proj
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_steps: 0
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - frequency:
      coeff: 2.0e-05
      reference_token_count: 32768
    coeff: 1.0e-05
    gamma: 1.0
    gamma_anneal_start_frac: 0.0
    gamma_anneal_final_gamma: 0.01
    gamma_anneal_end_frac: 1.0
    type: SmoothL0ImportanceMinimalityLoss
  - coeff: 1.0
    routing:
      type: uniform_k_subset
    type: StochasticReconSubsetLoss
  - coeff: 0.5
    scope:
      type: sc
    optimizer:
      type: adam
      beta1: 0.5
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        start_val: 0.01
        warmup_pct: 0.025
        final_val_frac: 1.0
        fn_type: constant
    n_warmup_steps: 2
    type: PersistentPGDReconLoss
  - coeff: 0.0
    type: FaithfulnessLoss
  seed: 0
  steps: 20000
runtime:
  remat_recon_forwards: false
  dp: 2
  launch_env:
    env:
      HF_HOME: /mnt/nw/home/a.vigouroux/.cache/huggingface
      PARAM_DECOMP_OUT_DIR: /mnt/nw/home/a.vigouroux/out
target:
  weights_dtype: bfloat16
  spec:
    kind: hf
    model_class: transformers.LlamaForCausalLM
    model_name: meta-llama/Llama-3.1-8B
wandb:
  entity: null
  project: param-decomp-llama
