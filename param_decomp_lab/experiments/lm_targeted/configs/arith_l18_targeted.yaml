# Targeted-PD (tPD) decomposition of Llama-3.1-8B layer-18 MLP on a FIXED "a+b=" arithmetic
# target distribution, faithful off-target via a broad fineweb NON-TARGET stream (SPEC §11).
#
# Sizing anchors, deliberately NOT the full-VPD C49k config (oversized for a narrow target):
# - C=2048/site (vs 8192 in the current full-VPD L18 run p-530237f8, 228 in the torch-tPD
#   addition config on experiment/8B_targeted) — lean, sized for a single narrow mechanism.
# - CI fn unchanged from current L18 practice (chunkwise d_model 4096 — sized to the residual
#   stream, not to C).
# - SmoothL0 impmin coeffs from p-530237f8 (same layer/model/penalty).
# - Non-target seq 512 (fineweb_llama_tok_512) — general-text inertness doesn't need 2048.
# tPD deltas: FaithfulnessLoss coeff 0 + warmup 0 (S36), PersistentPGDReconLoss in the TARGET
# pass (S39, sc scope — per-position sources shared across the resampled prompt batch),
# stochastic-only non-target (S35), impmin x2 off-target (S37).
# The ArithmeticCIGrid eval runs inline on the target distribution; the target prompts are
# tokenized with add_special_tokens=true to match the probe's BOS-inclusive tokenization.
run_name: arith-l18-targeted-ppgd
cadence:
  keep_last_n_checkpoints: 3
  save_every: 2000
  train_log_every: 100
data:
  # TARGET stream: the fixed "a+b=" grid (a,b in 1..100), one prompt per line. Tokenizes to a
  # shared length 5 with BOS (add_special_tokens: true), end-padded to max_seq_len 16 (clears
  # cuDNN flash-attn min-seq); recon scored on the first 5 positions.
  tokenizer_name: meta-llama/Llama-3.1-8B
  prompts_file: param_decomp_lab/experiments/lm_targeted/prompts/arithmetic_add_1_100.txt
  max_seq_len: 16
  add_special_tokens: true
nontarget:
  batch_size: 256
  impmin_coeff_ratio: 2.0
  data:
    dataset_name: parquet
    data_files: /mnt/polished-lake/artifacts/mechanisms/param-decomp/datasets/fineweb_llama_tok_512/*.parquet
    column_name: input_ids
    tokenizer_name: meta-llama/Llama-3.1-8B
    max_seq_len: 512
    is_tokenized: true
    streaming: false
    eval_split: train
eval:
  batch_size: 256
  every: 1000
  metrics:
  - ci_alive_threshold: 0.0
    groups: null
    type: CI_L0
  - rounding_threshold: 0.0
    type: CEandKLLosses
  # probe built in-memory at startup from the target tokenizer (defaults: add, a,b in 1..100)
  - type: ArithmeticCIGrid
  n_steps: 1
  slow_every: 10000
  slow_on_first_step: false
pd:
  batch_size: 256
  ci_config:
    type: chunkwise_transformer
    blocks_per_chunk: 1
    d_model: 4096
    n_blocks: 4
    n_heads: 64
    mlp_hidden: 16384
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: null
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 5.0e-05
      warmup_pct: 0.0
    weight_decay: 0.0
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 0.01
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 5.0e-05
      warmup_pct: 0.0
    weight_decay: 0.0
  decomposition_targets:
  - C: 2048
    module_pattern: model.layers.18.mlp.gate_proj
  - C: 2048
    module_pattern: model.layers.18.mlp.up_proj
  - C: 2048
    module_pattern: model.layers.18.mlp.down_proj
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_steps: 0
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - frequency:
      coeff: 2.0e-05
      reference_token_count: 32768
    coeff: 1.0e-05
    gamma: 1.0
    gamma_anneal_start_frac: 0.0
    gamma_anneal_final_gamma: 0.01
    gamma_anneal_end_frac: 1.0
    type: SmoothL0ImportanceMinimalityLoss
  - coeff: 0.5
    routing:
      type: uniform_k_subset
    type: StochasticReconSubsetLoss
  - coeff: 0.5
    scope:
      type: sc
    optimizer:
      type: adam
      beta1: 0.5
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        start_val: 0.01
        warmup_pct: 0.025
        final_val_frac: 1.0
        fn_type: constant
    n_warmup_steps: 2
    type: PersistentPGDReconLoss
  - coeff: 0.0
    type: FaithfulnessLoss
  seed: 0
  steps: 20000
runtime:
  remat_recon_forwards: false
  dp: 8
  launch_env:
    env:
      HF_HOME: /mnt/polished-lake/artifacts/public/hf_cache
      PARAM_DECOMP_OUT_DIR: /mnt/polished-lake/home/lee/param-decomp/out
target:
  weights_dtype: bfloat16
  spec:
    kind: hf
    model_class: transformers.LlamaForCausalLM
    model_name: meta-llama/Llama-3.1-8B
wandb:
  entity: null
  project: param-decomp-llama
