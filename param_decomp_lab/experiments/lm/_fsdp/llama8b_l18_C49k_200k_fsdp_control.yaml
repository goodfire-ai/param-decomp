# Torch control of the JAX C49k run (wandb goodfire/param-decomp-llama/jax-l18-C49k-200k),
# whose config is nano_param_decomp_jax/jax_single_pool/configs/torch/llama8b_l18_C49k_200k_1pool.yaml.
# Same algorithm + hyperparameters (C=49152 x3 @ L18 MLP, B=512, seq2048, 200k steps,
# lrs 7e-5, all 4 losses, bf16 frozen target). DOCUMENTED EDITS vs that yaml, all
# substrate not semantics:
#   1. target: kind hf (transformers.LlamaForCausalLM) -> hf_weights_in_vendored
#      (VendoredLlama; residual-start + FSDP2 require the vendored arch). Patterns lose
#      the "model." prefix accordingly. weights_dtype bfloat16 = what the JAX run's
#      frozen target actually ran.
#   2. runtime: DDP dp:32 -> FsdpRuntimeConfig (compile on, checkpoint_blocks false —
#      PPGD forbids it, shard_frozen_target on). World size comes from --dp at launch.
#   3. StochasticReconSubsetLoss -> ChunkwiseSubsetReconLoss at sites_per_chunk: 3
#      (3 sites = ONE chunk, uniform-k over all sites — identical semantics; this is
#      the FSDP-validated variant with the checkpointed recon forward; fused KL is an
#      optimization, not semantics).
#   4. PPGD scope broadcast_across_batch -> sc (the same scope, shape-spelled name).
#   5. data.streaming false -> true (local parquet streaming recipe a4bf7fa0; kills the
#      multi-rank startup thunderherd; data ORDER differs from JAX regardless).
#   6. eval.batch_size 512 -> 64 (eval-only: the async slow-eval job loads the
#      consolidated, unsharded model at dp=8, so 64 -> mb8/rank, the known-good size).
# Launch: pd-lm-fsdp <this> --dp <from mem smokes> --time ... (dp must divide 512)
cadence:
  keep_last_n_checkpoints: 2
  save_every: 5000
  train_log_every: 200
  dense_log_phase: { every: 25, until_step: 400 }
data:
  buffer_size: 1000
  column_name: input_ids
  data_files: /mnt/data/artifacts/mechanisms/param-decomp/datasets/fineweb_llama_tok_2048/*.parquet
  dataset_name: parquet
  eval_split: train
  is_tokenized: true
  max_seq_len: 2048
  revision: null
  shuffle_each_epoch: true
  streaming: true
  tokenizer_name: meta-llama/Llama-3.1-8B
  train_split: train
eval:
  batch_size: 64
  every: 1000
  metrics:
  - n_batches_accum: 1
    type: CIHistograms
  - ci_alive_threshold: 0.0
    type: ComponentActivationDensity
  - ci_alive_threshold: 0.0
    groups: null
    type: CI_L0
  - rounding_threshold: 0.0
    type: CEandKLLosses
  - type: CIMeanPerComponent
  - coeff: null
    type: StochasticHiddenActsReconLoss
  - type: CIHiddenActsReconLoss
  - coeff: null
    init: random
    mask_scope: c
    n_steps: 20
    step_size: 0.1
    type: PGDReconLoss
  n_steps: 1
  slow_every: 10000
  slow_on_first_step: true
pd:
  batch_size: 512
  ci_config:
    fn_type: global_shared_transformer
    hidden_dims: null
    mode: global
    simple_transformer_ci_cfg:
      attn_config:
        max_len: 2048
        n_heads: 64
        rope_base: 10000.0
      d_model: 4096
      mlp_hidden_dim:
      - 16384
      n_blocks: 4
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: null
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 7.0e-05
      warmup_pct: 0.0
    weight_decay: 0.0
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 0.01
    lr_schedule:
      final_val_frac: 0.1
      fn_type: cosine
      start_val: 7.0e-05
      warmup_pct: 0.0
    weight_decay: 0.0
  decomposition_targets:
  - C: 49152
    module_pattern: layers.18.mlp.gate_proj
  - C: 49152
    module_pattern: layers.18.mlp.up_proj
  - C: 49152
    module_pattern: layers.18.mlp.down_proj
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_steps: 400
  faithfulness_warmup_weight_decay: 0.0
  identity_decomposition_targets: null
  loss_metrics:
  - beta: 0.2
    coeff: 5.0e-06
    eps: 1.0e-12
    p_anneal_end_frac: 1.0
    p_anneal_final_p: 0.4
    p_anneal_start_frac: 0.0
    pnorm: 2.0
    type: ImportanceMinimalityLoss
  - type: ChunkwiseSubsetReconLoss
    coeff: 0.5
    sites_per_chunk: 3
    n_samples: 1
    use_fused_kl: true
    routing:
      type: uniform_k_subset
  - coeff: 0.5
    n_samples: 1
    n_warmup_steps: 2
    optimizer:
      beta1: 0.5
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        final_val_frac: 1.0
        fn_type: constant
        start_val: 0.01
        warmup_pct: 0.025
      type: adam
    scope:
      type: sc
    start_frac: 0.0
    type: PersistentPGDReconLoss
    use_sigmoid_parameterization: false
  - coeff: 100000.0
    type: FaithfulnessLoss
  n_mask_samples: 1
  sampling: continuous
  seed: 0
  sigmoid_type: leaky_hard
  steps: 200000
  tied_weights: null
  use_delta_component: true
runtime:
  autocast_bf16: true
  device: cuda:0
  compile_model: true
  compile_ci_fn: true
  checkpoint_blocks: false
  shard_frozen_target: true
target:
  activation_checkpointing: false
  output_extract: 0
  weights_dtype: bfloat16
  spec:
    kind: hf_weights_in_vendored
    model_class: param_decomp_lab.experiments.lm.vendored.llama_3_1.model.VendoredLlama
    model_name: meta-llama/Llama-3.1-8B
wandb:
  entity: goodfire
  project: param-decomp-llama
