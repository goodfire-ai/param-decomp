pd:
  seed: 0
  ci_config:
    mode: global
    fn_type: global_shared_transformer
    simple_transformer_ci_cfg:
      d_model: 4096
      n_blocks: 8
      mlp_hidden_dim:
      - 16384
      attn_config:
        n_heads: 32
        max_len: 1024
        rope_base: 10000.0
  sigmoid_type: leaky_hard
  decomposition_targets:
  - module_pattern: h.*.attn.q_proj
    C: 1024
  - module_pattern: h.*.attn.k_proj
    C: 1024
  batch_size: 16
  steps: 100000
  components_optimizer:
    lr_schedule:
      start_val: 5.0e-05
      warmup_pct: 0.0
      final_val_frac: 0.1
      fn_type: cosine
    grad_clip_norm: 0.01
  ci_fn_optimizer:
    lr_schedule:
      start_val: 5.0e-05
      warmup_pct: 0.0
      final_val_frac: 0.1
      fn_type: cosine
  faithfulness_warmup_steps: 400
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_weight_decay: 0.0
  losses:
    faith:
      coeff: 100000000.0
    stoch:
      coeff: 50.0
    imp:
      coeff: 4.0e-05
      pnorm: 2.0
      beta: 0.5
      p_anneal_start_frac: 0.0
      p_anneal_final_p: 0.3
      p_anneal_end_frac: 1.0
      eps: 1.0e-12
    ppgd:
      coeff: 1.0
      optimizer:
        type: adam
        beta1: 0.5
        beta2: 0.99
        eps: 1.0e-08
        lr_schedule:
          start_val: 0.01
          warmup_pct: 0.05
          final_val_frac: 1.0
          fn_type: constant
      scope:
        type: per_batch_per_position
      use_sigmoid_parameterization: false
      n_warmup_steps: 2
      n_samples: 1
cadence:
  train_log_every: 5
  save_every: 100000000
eval:
  n_steps: 1
  batch_size: 128
  every: 100000000
  slow_every: 100000000
  slow_on_first_step: false
  metrics:
  - type: CI_L0
    groups:
      total:
      - '*'
      q_proj:
      - h.*.attn.q_proj
      k_proj:
      - h.*.attn.k_proj
      layer_0:
      - h.0.*
      layer_23:
      - h.23.*
      layer_47:
      - h.47.*
  - type: CEandKLLosses
    rounding_threshold: 0.0
  - type: PGDReconLoss
    init: random
    step_size: 0.1
    n_steps: 20
    mask_scope: shared_across_batch
