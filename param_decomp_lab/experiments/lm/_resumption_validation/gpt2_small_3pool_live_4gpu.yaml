pd:
  seed: 0
  ci_config:
    mode: global
    fn_type: global_shared_transformer
    simple_transformer_ci_cfg:
      d_model: 768
      n_blocks: 2
      mlp_hidden_dim:
      - 512
      attn_config:
        n_heads: 12
        max_len: 128
        rope_base: 10000.0
  sigmoid_type: leaky_hard
  decomposition_targets:
  - module_pattern: h.*.attn.q_proj
    C: 64
  - module_pattern: h.*.attn.k_proj
    C: 64
  batch_size: 2
  steps: 25
  components_optimizer:
    lr_schedule:
      start_val: 0.0003
      warmup_pct: 0.03
      final_val_frac: 0.1
      fn_type: cosine
    grad_clip_norm: 0.01
  ci_fn_optimizer:
    lr_schedule:
      start_val: 0.0001
      warmup_pct: 0.03
      final_val_frac: 0.1
      fn_type: cosine
  faithfulness_warmup_steps: 2
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_weight_decay: 0.0
  losses:
    faith:
      coeff: 100000000.0
    imp:
      coeff: 3.2e-05
      pnorm: 2.0
      p_anneal_start_frac: 0.0
      p_anneal_final_p: 0.3
      p_anneal_end_frac: 1.0
      eps: 1.0e-12
    freq:
      coeff: 1.6e-05
      pnorm: 2.0
      reference_token_count: 256
      p_anneal_start_frac: 0.0
      p_anneal_final_p: 0.3
      p_anneal_end_frac: 1.0
      eps: 1.0e-12
    stoch:
      coeff: 100.0
    ppgd:
      coeff: 1.0
      optimizer:
        type: adam
        beta1: 0.5
        beta2: 0.99
        eps: 1.0e-08
        lr_schedule:
          start_val: 0.01
          warmup_pct: 0.025
          final_val_frac: 1.0
          fn_type: constant
      scope:
        type: per_batch_per_position
      use_sigmoid_parameterization: false
      n_warmup_steps: 2
      n_samples: 1
cadence:
  train_log_every: 5
  save_every: 5
eval:
  n_steps: 1
  batch_size: 2
  every: 10
  slow_every: 10
  slow_on_first_step: true
  metrics:
  - type: CI_L0
    groups:
      total:
      - '*'
  - type: CEandKLLosses
    rounding_threshold: 0.0
runtime:
  autocast_bf16: true
  device: cuda
  dp: null
  topology:
    use_fused_kl: true
    ci_ranks:
    - 2
    ppgd_ranks:
    - 3
    layerwise_block_groups:
    - ranks:
      - 0
      - 1
      owned_sites:
      - h.0.attn.q_proj
      - h.0.attn.k_proj
      - h.1.attn.q_proj
      - h.1.attn.k_proj
      - h.2.attn.q_proj
      - h.2.attn.k_proj
      - h.3.attn.q_proj
      - h.3.attn.k_proj
      - h.4.attn.q_proj
      - h.4.attn.k_proj
      - h.5.attn.q_proj
      - h.5.attn.k_proj
      - h.6.attn.q_proj
      - h.6.attn.k_proj
      - h.7.attn.q_proj
      - h.7.attn.k_proj
      - h.8.attn.q_proj
      - h.8.attn.k_proj
      - h.9.attn.q_proj
      - h.9.attn.k_proj
      - h.10.attn.q_proj
      - h.10.attn.k_proj
      - h.11.attn.q_proj
      - h.11.attn.k_proj
target:
  spec:
    kind: hf_weights_in_vendored
    model_class: param_decomp_lab.experiments.lm.pretrain.models.gpt2_simple.GPT2Simple
    model_name: openai-community/gpt2
  output_extract: 0
  activation_checkpointing: false
data:
  tokenizer_name: openai-community/gpt2
  max_seq_len: 128
  dataset_name: apollo-research/Skylion007-openwebtext-tokenizer-gpt2
  column_name: input_ids
  train_split: train
  eval_split: train
  is_tokenized: true
  streaming: true
  buffer_size: 1000
  shuffle_each_epoch: true
