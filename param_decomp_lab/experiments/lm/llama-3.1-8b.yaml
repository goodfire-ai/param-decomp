run_name: jax-llama-3.1-8b-l18
pd:
  seed: 0
  ci_config:
    type: chunkwise_transformer
    blocks_per_chunk: 1
    d_model: 4096
    n_blocks: 4
    n_heads: 64
    mlp_hidden: 16384
  decomposition_targets:
  - module_pattern: model.layers.18.mlp.gate_proj
    C: 8192
  - module_pattern: model.layers.18.mlp.up_proj
    C: 8192
  - module_pattern: model.layers.18.mlp.down_proj
    C: 8192 # There are 14336 neurons
  components_optimizer:
    lr_schedule:
      start_val: 5.0e-05
      warmup_pct: 0.0
      final_val_frac: 0.1
      fn_type: cosine
    grad_clip_norm: 0.01
  ci_fn_optimizer:
    lr_schedule:
      start_val: 5.0e-05
      warmup_pct: 0.0
      final_val_frac: 0.1
      fn_type: cosine
  steps: 400000
  batch_size: 128
  faithfulness_warmup_steps: 400
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - frequency:
      coeff: 2.0e-05
      reference_token_count: 32768
    coeff: 1.0e-05
    type: SmoothL0ImportanceMinimalityLoss
    gamma:
      start_val: 1.0
      fn_type: linear
      final_val_frac: 0.01
      warmup_pct: 0.0
  - type: StochasticReconSubsetLoss
    coeff: 0.5
    routing:
      type: uniform_k_subset
  - type: PersistentPGDReconLoss
    coeff: 0.5
    optimizer:
      type: adam
      beta1: 0.5
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        start_val: 0.01
        warmup_pct: 0.025
        final_val_frac: 1.0
        fn_type: constant
    scope:
      type: bsc
    n_warmup_steps: 2
  - type: FaithfulnessLoss
    coeff: 10000000.0
cadence:
  train_log_every: 200
  save_every: 5000
  keep_last_n_checkpoints: 2
eval:
  n_steps: 1
  batch_size: 128
  every: 1000
  slow_every: 10000
  slow_on_first_step: true
  metrics:
  - type: CIHistograms
    n_batches_accum: 1
  - type: ComponentActivationDensity
  - type: CI_L0
    groups: null
  - type: CEandKLLosses
    rounding_threshold: 0.0
  - type: CIMeanPerComponent
  - type: StochasticHiddenActsReconLoss
  - type: CIHiddenActsReconLoss
  - type: PGDReconLoss
    init: random
    step_size: 0.1
    n_steps: 20
    mask_scope: c
target:
  spec:
    kind: hf
    model_class: transformers.LlamaForCausalLM
    model_name: meta-llama/Llama-3.1-8B
  weights_dtype: bfloat16
  output_extract: logits
data:
  tokenizer_name: meta-llama/Llama-3.1-8B
  max_seq_len: 2048
  buffer_size: 1000
  dataset_name: parquet
  data_files: /mnt/data/artifacts/mechanisms/param-decomp/datasets/fineweb_llama_tok_2048/*.parquet
  column_name: input_ids
  train_split: train
  eval_split: train
  shuffle_each_epoch: true
  is_tokenized: true
  streaming: false
runtime:
  dp: 128
wandb:
  project: param-decomp-llama
