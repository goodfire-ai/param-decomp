pd:
  seed: 0
  n_mask_samples: 1
  batch_size: 16
  steps: 30
  ci_config:
    mode: global
    fn_type: global_shared_transformer
    hidden_dims: null
    simple_transformer_ci_cfg:
      d_model: 4096
      n_blocks: 8
      mlp_hidden_dim:
      - 16384
      attn_config:
        n_heads: 32
        max_len: 1024
        rope_base: 10000.0
  sampling: continuous
  sigmoid_type: leaky_hard
  decomposition_targets:
  - module_pattern: layers.18.mlp.gate_proj
    C: 28672
  - module_pattern: layers.18.mlp.up_proj
    C: 28672
  - module_pattern: layers.18.mlp.down_proj
    C: 28672
  identity_decomposition_targets: null
  use_delta_component: true
  tied_weights: null
  faithfulness_warmup_steps: 0
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_weight_decay: 0.0
  components_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: 0.01
    weight_decay: 0.0
    lr_schedule:
      fn_type: cosine
      start_val: 0.000707
      warmup_pct: 0.01
      final_val_frac: 0.1
  ci_fn_optimizer:
    betas:
    - 0.9
    - 0.999
    grad_clip_norm: null
    weight_decay: 0.0
    lr_schedule:
      fn_type: cosine
      start_val: 0.0001414
      warmup_pct: 0.01
      final_val_frac: 0.1
  loss_metrics:
  - type: FaithfulnessLoss
    coeff: 1000000.0
  - type: ImportanceMinimalityLoss
    coeff: 4.0e-05
    pnorm: 2.0
    beta: 0.5
    p_anneal_start_frac: 0.0
    p_anneal_final_p: 0.3
    p_anneal_end_frac: 1.0
    eps: 1.0e-12
  - type: StochasticReconLayerwiseLoss
    coeff: 50.0
  - type: PersistentPGDReconLoss
    coeff: 1.0
    n_samples: 1
    n_warmup_steps: 2
    start_frac: 0.0
    use_sigmoid_parameterization: false
    scope:
      type: per_batch_per_position
    optimizer:
      type: adam
      beta1: 0.5
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        fn_type: constant
        start_val: 0.01
        warmup_pct: 0.01
        final_val_frac: 1.0
cadence:
  train_log_every: 1
  save_every: 2000
  keep_last_n_checkpoints: null
eval:
  n_steps: 1
  batch_size: 16
  every: 100
  slow_every: 1000
  slow_on_first_step: false
  metrics:
  - type: CI_L0
    ci_alive_threshold: 0.0
    groups:
      gate:
      - layers.18.mlp.gate_proj
      up:
      - layers.18.mlp.up_proj
      down:
      - layers.18.mlp.down_proj
      total:
      - '*'
  - type: CEandKLLosses
    rounding_threshold: 0.0
target:
  activation_checkpointing: false
  output_extract: 0
  weights_dtype: bfloat16
  spec:
    kind: hf_weights_in_vendored
    model_class: param_decomp_lab.experiments.lm.vendored.llama_3_1.model.VendoredLlama
    model_name: meta-llama/Llama-3.1-8B
data:
  tokenizer_name: meta-llama/Llama-3.1-8B
  max_seq_len: 1024
  buffer_size: 1000
  dataset_name: HuggingFaceFW/fineweb
  data_files: sample/10BT/*.parquet
  column_name: text
  train_split: train
  eval_split: train
  shuffle_each_epoch: true
  is_tokenized: false
  streaming: true
runtime:
  autocast_bf16: true
  device: cuda
  dp: null
  parallelism: ddp
wandb:
  entity: goodfire
  project: param-decomp
