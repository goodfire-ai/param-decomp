run_name: jax-l18-mlp-smoothl0-c3e5-dp16
pd:
  seed: 0
  ci_config:
    type: chunkwise_transformer
    blocks_per_chunk: 1
    d_model: 4096
    n_blocks: 4
    n_heads: 64
    mlp_hidden: 16384
  decomposition_targets:
  - module_pattern: model.layers.18.mlp.gate_proj
    C: 8000
  - module_pattern: model.layers.18.mlp.up_proj
    C: 8000
  - module_pattern: model.layers.18.mlp.down_proj
    C: 10000
  components_optimizer:
    lr_schedule:
      start_val: 5.0e-05
      warmup_pct: 0.0
      final_val_frac: 0.1
      fn_type: cosine
    grad_clip_norm: 0.01
  ci_fn_optimizer:
    lr_schedule:
      start_val: 5.0e-05
      warmup_pct: 0.0
      final_val_frac: 0.1
      fn_type: cosine
  steps: 200000
  batch_size: 64
  faithfulness_warmup_steps: 400
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - type: SmoothL0ImportanceMinimalityLoss
    coeff: 3.0e-05
    gamma: 1.0
    beta: 0.5
    gamma_anneal_start_frac: 0.0
    gamma_anneal_final_gamma: 0.1
    gamma_anneal_end_frac: 1.0
  - type: StochasticReconSubsetLoss
    coeff: 0.5
    routing:
      type: uniform_k_subset
    n_mask_samples: 1
  - type: PersistentPGDReconLoss
    coeff: 0.5
    optimizer:
      type: adam
      beta1: 0.5
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        start_val: 0.01
        warmup_pct: 0.025
        final_val_frac: 1.0
        fn_type: constant
    scope:
      type: bsc
    n_warmup_steps: 2
    start_frac: 0.0
    n_samples: 1
  - type: FaithfulnessLoss
    coeff: 100000.0
runtime:
  dp: 16
  remat_recon_forwards: false
cadence:
  train_log_every: 200
  save_every: 5000
  keep_last_n_checkpoints: 2
eval:
  batch_size: 64
  n_steps: 1
  every: 1000
  slow_every: 10000
  slow_on_first_step: true
  metrics:
  - type: CIHistograms
    n_batches_accum: 1
  - type: ComponentActivationDensity
    ci_alive_threshold: 0.0
  - type: CI_L0
    groups: null
    ci_alive_thresholds: [0.0, 0.01]
  - type: CEandKLLosses
    rounding_threshold: 0.0
  - type: CIMeanPerComponent
  - type: StochasticHiddenActsReconLoss
  - type: CIHiddenActsReconLoss
  - type: PGDReconLoss
    init: random
    step_size: 0.1
    n_steps: 20
    mask_scope: c
target:
  spec:
    kind: hf
    model_class: transformers.LlamaForCausalLM
    model_name: meta-llama/Llama-3.1-8B
  output_extract: logits
data:
  dataset_name: parquet
  data_files: /mnt/delicate-frog/artifacts/mechanisms/param-decomp/datasets/fineweb_llama_tok_2048/*.parquet
  tokenizer_name: meta-llama/Llama-3.1-8B
  column_name: input_ids
  max_seq_len: 2048
  is_tokenized: true
  streaming: false
  train_split: train
  eval_split: train
  shuffle_each_epoch: true
  buffer_size: 1000
wandb:
  project: param-decomp-llama
