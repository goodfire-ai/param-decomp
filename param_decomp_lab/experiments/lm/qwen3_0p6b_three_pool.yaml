# Qwen3-0.6B SPD via the 3-pool training strategy.
#
# Layout: 28 LW + 1 CI + 3 PPGD = 32 GPUs across 4 nodes.
#   * 28 layerwise block groups (one per Qwen3 layer), each rank owns all 7
#     sites of its layer (q/k/v/o + gate/up/down). 1 rank per group → no
#     in-block DDP.
#   * CI pool = rank 28 (single-rank for MVP — multi-rank CI works in the
#     layout but the 32-GPU budget here is too tight for N_ci > 1 given the
#     N_ci | N_per_block_lw constraint requires N_per_block_lw ≥ N_ci).
#   * PPGD pool = ranks 29..31.
#   * batch_size=24 (divisible by N_ppgd=3; the 2-pool example used 32 + 4
#     PPGD which doesn't quite fit here).
#
# This example uses `mode: global` with `fn_type: global_shared_transformer`
# — the whole point of the 3-pool split. Under 2-pool, sites are sharded
# across pool-A ranks, structurally ruling out CI fns that span all sites.
#
# `eval` is required by the schema but unused on the 3-pool path
# (`optimize_three_pool` does not run eval yet).
#
# The lm/run.py main() builds the data loader with `dist_state=None` when
# `three_pool` is set, so every rank reads the full global batch and each pool
# slices to its own DP shard.

pd:
  seed: 0
  n_mask_samples: 1
  # The whole point: a global shared transformer CI fn that spans all sites.
  # Held replicated on every CI-pool rank.
  ci_config:
    mode: global
    fn_type: global_shared_transformer
    simple_transformer_ci_cfg:
      d_model: 128
      n_blocks: 2
      mlp_hidden_dim: [512]
      attn_config:
        n_heads: 4
        max_len: 1024
        rope_base: 10000.0
  sampling: continuous
  sigmoid_type: leaky_hard
  decomposition_targets:
    - { module_pattern: model.layers.*.self_attn.q_proj, C: 32 }
    - { module_pattern: model.layers.*.self_attn.k_proj, C: 32 }
    - { module_pattern: model.layers.*.self_attn.v_proj, C: 32 }
    - { module_pattern: model.layers.*.self_attn.o_proj, C: 32 }
    - { module_pattern: model.layers.*.mlp.gate_proj,    C: 32 }
    - { module_pattern: model.layers.*.mlp.up_proj,      C: 32 }
    - { module_pattern: model.layers.*.mlp.down_proj,    C: 32 }
  identity_decomposition_targets: null
  use_delta_component: true
  batch_size: 24
  steps: 1000
  components_optimizer:
    lr_schedule: { start_val: 5.0e-05, warmup_pct: 0.0, final_val_frac: 1.0, fn_type: constant }
  ci_fn_optimizer:
    lr_schedule: { start_val: 5.0e-05, warmup_pct: 0.0, final_val_frac: 1.0, fn_type: constant }
  faithfulness_warmup_steps: 0
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
    - { type: FaithfulnessLoss,            coeff: 1.0e+06 }
    - { type: StochasticReconLayerwiseLoss, coeff: 0.5 }
    - type: ImportanceMinimalityLoss
      coeff: 1.0e-04
      pnorm: 1.0
      beta: 0.5
      p_anneal_start_frac: 0.0
      p_anneal_final_p: 1.0
      p_anneal_end_frac: 1.0
      eps: 1.0e-12
    - type: PersistentPGDReconLoss
      coeff: 0.5
      optimizer:
        type: sign
        lr_schedule: { start_val: 0.01, warmup_pct: 0.0, final_val_frac: 1.0, fn_type: constant }
      scope: { type: per_batch_per_position }
      use_sigmoid_parameterization: false
      n_warmup_steps: 3
      n_samples: 1

cadence:
  train_log_every: 50
  # Distributed checkpoint: at save points, V/U is gathered from every LW
  # block leader and the trained CI fn from the CI pool leader onto rank 0,
  # which assembles a state_dict matching `load_component_model_from_checkpoint`.
  save_every: 500

# Eval is unused under 3-pool; leave null.
eval: null

runtime:
  autocast_bf16: true
  device: cuda
  dp: null

target:
  spec:
    kind: hf
    model_class: transformers.AutoModelForCausalLM
    model_name: Qwen/Qwen3-0.6B-Base
  output_extract: logits
  # Critical for 3-pool: each pool runs its own target forward on the FULL
  # global batch, so activation checkpointing keeps target-fwd memory low on
  # both LW (which also does layerwise stoch recon) and PPGD (which does
  # PPGD warmup).
  activation_checkpointing: true

data:
  tokenizer_name: Qwen/Qwen3-0.6B-Base
  max_seq_len: 1024
  dataset_name: monology/pile-uncopyrighted
  column_name: text
  train_split: train
  eval_split: train
  is_tokenized: false
  streaming: true
  buffer_size: 1000
  shuffle_each_epoch: true

three_pool:
  use_fused_kl: true
  # defer_vu_opt: async-pipeline the LW V/U opt step + V/U ship-back so the
  # in-block all_reduce (NCCL stream) overlaps with the next iter's target_fwd
  # (default CUDA stream). PPGD's V/U recv is symmetrically deferred (must be —
  # else LW's deferred send would deadlock with PPGD's blocking recv).
  # For N_per_block=1 (as below), the in-block all_reduce is a no-op so this
  # toggle has no observable wall-clock effect; flip True once you have a
  # topology with N_per_block > 1 to A/B-measure the win.
  defer_vu_opt: false
  ci_ranks: [28]
  ppgd_ranks: [29, 30, 31]
  layerwise_block_groups:
    - { ranks: [0],  owned_sites: [model.layers.0.self_attn.q_proj,  model.layers.0.self_attn.k_proj,  model.layers.0.self_attn.v_proj,  model.layers.0.self_attn.o_proj,  model.layers.0.mlp.gate_proj,  model.layers.0.mlp.up_proj,  model.layers.0.mlp.down_proj] }
    - { ranks: [1],  owned_sites: [model.layers.1.self_attn.q_proj,  model.layers.1.self_attn.k_proj,  model.layers.1.self_attn.v_proj,  model.layers.1.self_attn.o_proj,  model.layers.1.mlp.gate_proj,  model.layers.1.mlp.up_proj,  model.layers.1.mlp.down_proj] }
    - { ranks: [2],  owned_sites: [model.layers.2.self_attn.q_proj,  model.layers.2.self_attn.k_proj,  model.layers.2.self_attn.v_proj,  model.layers.2.self_attn.o_proj,  model.layers.2.mlp.gate_proj,  model.layers.2.mlp.up_proj,  model.layers.2.mlp.down_proj] }
    - { ranks: [3],  owned_sites: [model.layers.3.self_attn.q_proj,  model.layers.3.self_attn.k_proj,  model.layers.3.self_attn.v_proj,  model.layers.3.self_attn.o_proj,  model.layers.3.mlp.gate_proj,  model.layers.3.mlp.up_proj,  model.layers.3.mlp.down_proj] }
    - { ranks: [4],  owned_sites: [model.layers.4.self_attn.q_proj,  model.layers.4.self_attn.k_proj,  model.layers.4.self_attn.v_proj,  model.layers.4.self_attn.o_proj,  model.layers.4.mlp.gate_proj,  model.layers.4.mlp.up_proj,  model.layers.4.mlp.down_proj] }
    - { ranks: [5],  owned_sites: [model.layers.5.self_attn.q_proj,  model.layers.5.self_attn.k_proj,  model.layers.5.self_attn.v_proj,  model.layers.5.self_attn.o_proj,  model.layers.5.mlp.gate_proj,  model.layers.5.mlp.up_proj,  model.layers.5.mlp.down_proj] }
    - { ranks: [6],  owned_sites: [model.layers.6.self_attn.q_proj,  model.layers.6.self_attn.k_proj,  model.layers.6.self_attn.v_proj,  model.layers.6.self_attn.o_proj,  model.layers.6.mlp.gate_proj,  model.layers.6.mlp.up_proj,  model.layers.6.mlp.down_proj] }
    - { ranks: [7],  owned_sites: [model.layers.7.self_attn.q_proj,  model.layers.7.self_attn.k_proj,  model.layers.7.self_attn.v_proj,  model.layers.7.self_attn.o_proj,  model.layers.7.mlp.gate_proj,  model.layers.7.mlp.up_proj,  model.layers.7.mlp.down_proj] }
