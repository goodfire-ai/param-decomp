# 1-pool equivalence test: GPT-2 base (124M) with separate q/k/v projections
# (HFWeightsInVendored → GPT2Simple), 5 layers, layerwise CI fn.
# Companion to equiv_5L_{2,3}pool.yaml — identical pd/runtime/target/data,
# only differs in the absence of a two_pool / three_pool topology block.
#
# Ported from gpt2_xl_full.yaml (the production GPT-2 XL canon), with the
# following downsizings for a fast cluster-friendly equivalence test:
#   * batch_size = 24, steps = 200   (vs canon 256, 200000)
#   * ci_config kept small: d_model=128 etc. (vs canon d_model=1024, 16 heads)
#   * Decomposition C = 64 per site (uniform) (vs varied 1024-8192)
#   * layerwise CI fn mode (vs canon layerwise — same)
#   * 5 layers (h.0..h.4) instead of GPT-2 XL's 48
#
# Loss coefficients, LRs, grad clip, PPGD optimizer, ImpMin pnorm + anneal,
# faithfulness warmup all match canon.
#
# Launch: torchrun --standalone --nproc_per_node=2 -m param_decomp_lab.experiments.lm.run \
#         param_decomp_lab/experiments/lm/equiv_5L_1pool.yaml

pd:
  seed: 0
  n_mask_samples: 1
  ci_config:
    mode: layerwise
    fn_type: transformer
    transformer_cfg:
      d_model: 128
      n_blocks: 2
      mlp_hidden_dim:
      - 512
      attn_config:
        n_heads: 4
        max_len: 1024
        rope_base: 10000.0
  sampling: continuous
  sigmoid_type: leaky_hard
  decomposition_targets:
  - module_pattern: h.[01234].attn.q_proj
    C: 64
  - module_pattern: h.[01234].attn.k_proj
    C: 64
  - module_pattern: h.[01234].attn.v_proj
    C: 64
  - module_pattern: h.[01234].attn.o_proj
    C: 64
  - module_pattern: h.[01234].mlp.c_fc
    C: 64
  - module_pattern: h.[01234].mlp.down_proj
    C: 64
  identity_decomposition_targets: null
  use_delta_component: true
  batch_size: 24
  steps: 200
  components_optimizer:
    lr_schedule:
      start_val: 5.0e-04
      warmup_pct: 0.0
      final_val_frac: 0.1
      fn_type: cosine
    grad_clip_norm: 0.01
  ci_fn_optimizer:
    lr_schedule:
      start_val: 1.0e-04
      warmup_pct: 0.0
      final_val_frac: 0.1
      fn_type: cosine
  faithfulness_warmup_steps: 400
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
  - type: FaithfulnessLoss
    coeff: 1.0e+08
  - type: StochasticReconLayerwiseLoss
    coeff: 50.0
  - type: ImportanceMinimalityLoss
    coeff: 4.0e-05
    pnorm: 2.0
    beta: 0.5
    p_anneal_start_frac: 0.0
    p_anneal_final_p: 0.3
    p_anneal_end_frac: 1.0
    eps: 1.0e-12
  - type: PersistentPGDReconLoss
    coeff: 1.0
    optimizer:
      type: adam
      beta1: 0.5
      beta2: 0.99
      eps: 1.0e-08
      lr_schedule:
        start_val: 0.01
        warmup_pct: 0.025
        final_val_frac: 1.0
        fn_type: constant
    scope:
      type: per_batch_per_position
    use_sigmoid_parameterization: false
    n_warmup_steps: 2
    n_samples: 1
cadence:
  train_log_every: 10
  save_every: null
eval: null
runtime:
  autocast_bf16: true
  device: cuda
  dp: null
target:
  spec:
    kind: hf_weights_in_vendored
    model_class: param_decomp_lab.experiments.lm.pretrain.models.gpt2_simple.GPT2Simple
    model_name: openai-community/gpt2
  output_extract: 0
  activation_checkpointing: false
data:
  tokenizer_name: openai-community/gpt2
  max_seq_len: 256
  dataset_name: monology/pile-uncopyrighted
  column_name: text
  train_split: train
  eval_split: train
  is_tokenized: false
  streaming: true
  buffer_size: 1000
  shuffle_each_epoch: true
