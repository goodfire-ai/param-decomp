run_name: jose-clip-both1.0
pd:
  seed: 0
  ci_config:
    type: chunkwise_transformer
    blocks_per_chunk: 4
    d_model: 2048
    n_blocks: 8
    n_heads: 16
    mlp_hidden: 8192
    input_tap_mode: per_block
  decomposition_targets:
  - module_pattern: h.*.mlp.c_fc
    C: 3072
  - module_pattern: h.*.mlp.down_proj
    C: 3584
  - module_pattern: h.*.attn.q_proj
    C: 512
  - module_pattern: h.*.attn.k_proj
    C: 512
  - module_pattern: h.*.attn.v_proj
    C: 1024
  - module_pattern: h.*.attn.o_proj
    C: 1024
  components_optimizer:
    lr_schedule:
      start_val: 5.0e-05
      warmup_pct: 0.0
      final_val_frac: 0.1
      fn_type: cosine
    grad_clip_norm: 1.0
  ci_fn_optimizer:
    lr_schedule:
      start_val: 5.0e-05
      warmup_pct: 0.0
      final_val_frac: 0.1
      fn_type: cosine
    grad_clip_norm: 1.0
  steps: 400000
  batch_size: 64
  faithfulness_warmup_steps: 400
  faithfulness_warmup_lr: 0.001
  faithfulness_warmup_weight_decay: 0.0
  loss_metrics:
    - type: ImportanceMinimalityLoss
      coeff: 0.0002
      pnorm: 2.0
      frequency:
        coeff: 1.0e-04
        reference_token_count: 32768
      p_anneal_start_frac: 0.0
      p_anneal_final_p: 0.4
      p_anneal_end_frac: 1.0
      eps: 1.0e-12
    - type: StochasticReconSubsetLoss
      coeff: 0.5
      routing:
        type: uniform_k_subset
    - type: PersistentPGDReconLoss
      coeff: 0.5
      optimizer:
        type: adam
        beta1: 0.5
        beta2: 0.99
        eps: 1.0e-08
        lr_schedule:
          start_val: 0.01
          warmup_pct: 0.025
          final_val_frac: 1.0
          fn_type: constant
      scope:
        type: bsc
      n_warmup_steps: 2
    - type: FaithfulnessLoss
      coeff: 10000000.0
cadence:
  train_log_every: 200
  save_every: 5000
  keep_last_n_checkpoints: 2
eval:
  n_steps: 1
  batch_size: 128
  every: 1000
  slow_every: 10000
  slow_on_first_step: true
  metrics:
    - type: CIHistograms
      n_batches_accum: 1
    - type: ComponentActivationDensity
    - type: CI_L0
      groups:
        layer_0:
        - h.0.*
        layer_1:
        - h.1.*
        layer_2:
        - h.2.*
        layer_3:
        - h.3.*
        total:
        - '*'
    - type: CEandKLLosses
      rounding_threshold: 0.0
    - type: CIMeanPerComponent
    - type: StochasticHiddenActsReconLoss
    - type: CIHiddenActsReconLoss
    - type: PGDReconLoss
      init: random
      step_size: 0.1
      n_steps: 20
      mask_scope: c
target:
  weights_dtype: bfloat16
  spec:
    kind: pretrained
    model_class: param_decomp_lab.experiments.lm.pretrain.models.llama_simple_mlp.LlamaSimpleMLP
    run_path: goodfire/spd/runs/t-9d2b8f02
data:
  tokenizer_name: EleutherAI/gpt-neox-20b
  max_seq_len: 512
  buffer_size: 1000
  dataset_name: parquet
  column_name: input_ids
  data_files: /mnt/data/artifacts/mechanisms/param-decomp/datasets/pile_neox_tok_512/*.parquet
  train_split: train
  eval_split: train
  shuffle_each_epoch: true
  is_tokenized: true
  streaming: false
runtime:
  dp: 8
wandb:
  project: param-decomp
  group: clip-ablation-jose
