# Scale-test config: Llama-3.1-8B, decompose block-18 MLP only (gate/up/down), small C, tiny
# batch/seq so it fits 1 GPU. Purpose: test whether the 8B frozen forward amortizes the
# functorch/functional_call overhead (the 4L result had functional 2.6x slower than the
# AOTAutograd intermediate). FsdpLMExperimentConfig format (pd.loss_metrics list). eval off.
pd:
  seed: 0
  n_mask_samples: 1
  ci_config:
    mode: global
    fn_type: global_shared_transformer
    hidden_dims: null
    simple_transformer_ci_cfg:
      d_model: 1024
      n_blocks: 1
      mlp_hidden_dim: [4096]
      attn_config:
        n_heads: 8
        max_len: 512
        rope_base: 10000.0
  sampling: continuous
  sigmoid_type: leaky_hard
  decomposition_targets:
  - module_pattern: layers.18.mlp.gate_proj
    C: 512
  - module_pattern: layers.18.mlp.up_proj
    C: 512
  - module_pattern: layers.18.mlp.down_proj
    C: 512
  identity_decomposition_targets: null
  use_delta_component: true
  components_optimizer:
    lr_schedule: {start_val: 5.0e-05, warmup_pct: 0.0, final_val_frac: 0.1, fn_type: cosine}
    grad_clip_norm: 0.01
  ci_fn_optimizer:
    lr_schedule: {start_val: 5.0e-05, warmup_pct: 0.0, final_val_frac: 0.1, fn_type: cosine}
  steps: 100000
  batch_size: 1
  faithfulness_warmup_steps: 0
  loss_metrics:
    - {type: ImportanceMinimalityLoss, coeff: 0.0002, pnorm: 2.0, beta: 0.5, p_anneal_start_frac: 0.0, p_anneal_final_p: 0.4, p_anneal_end_frac: 1.0, eps: 1.0e-12}
    - {type: StochasticReconSubsetLoss, coeff: 0.5, routing: {type: uniform_k_subset}}
    - {type: PGDReconLoss, coeff: 0.5, init: random, step_size: 0.1, n_steps: 1, mask_scope: unique_per_datapoint}
    - {type: FaithfulnessLoss, coeff: 10000000.0}
runtime:
  autocast_bf16: true
  device: cuda
  dp: null
  compile_model: true
  compile_ci_fn: true
  checkpoint_blocks: true
  shard_frozen_target: false
cadence: {train_log_every: 200, save_every: 5000, keep_last_n_checkpoints: 2}
eval: null
target:
  spec:
    kind: hf_weights_in_vendored
    model_class: param_decomp_lab.experiments.lm.vendored.llama_3_1.model.VendoredLlama
    model_name: meta-llama/Llama-3.1-8B
  output_extract: 0
  weights_dtype: float32
data:
  tokenizer_name: meta-llama/Llama-3.1-8B
  max_seq_len: 512
  buffer_size: 1000
  dataset_name: HuggingFaceFW/fineweb
  data_files: sample/350BT/*.parquet
  column_name: text
  train_split: train
  eval_split: train
  is_tokenized: false
  streaming: true
wandb:
  project: param-decomp
